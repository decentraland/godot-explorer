appId: org.decentraland.godotexplorer
name: Categories
---
# Each chip opens a screen titled with the category and a grid of places (live data, so only "some content
# below the header" is checked). The home and its chips are gone while the category shows.
- runFlow: ../subflows/ensure-home.yaml

# Social
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn: "SOCIAL"
- extendedWaitUntil:
    visible: "Social"
    timeout: 30000
- assertNotVisible: "Popular"
- assertVisible:
    text: ".+"
    below: "Search"
    above: "explore"
- tapOn:
    text: "Back"
    index: 0
- extendedWaitUntil:
    visible: "Popular"
    timeout: 30000

