[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/dcl_engine"]

[workspace.package]
version = "1.16.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
strip = false

[profile.dev-release]
inherits = "release"
opt-level = 2
lto = "thin"
debug = 1
strip = "none"
