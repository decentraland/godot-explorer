[package]
name = "dcl_host"
version.workspace = true
edition.workspace = true
publish = false

# What the native host (Kotlin, Swift) calls and implements: creating the core at launch and the
# host-only traits (D-41). A foreign trait has one process-global vtable, so each trait is
# implemented by exactly one runtime: these by Kotlin/Swift, `dcl_core`'s FFI by the JS shell.
[lib]
crate-type = ["rlib"]

[dependencies]
dcl_core = { path = "../dcl_core" }
uniffi = { version = "=0.31" }
tokio = { version = "1.40.0", features = ["time"] }
