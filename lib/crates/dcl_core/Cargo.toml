[package]
name = "dcl_core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "time", "macros", "net", "sync", "fs", "io-util"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.92", features = ["raw_value"] }
anyhow = "1.0.70"
url = "2.5"

[features]
use_pulse = []
