[package]
name = "dcl_core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "time", "macros", "net", "sync", "fs", "io-util"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.92", features = ["raw_value"] }
anyhow = "1.0.70"
url = "2.5"
once_cell = "1.16.0"
http = "0.2.9"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli"] }
rand = "0.8"
ethers-core = { version = "2.0" }
ethers-signers = { version = "2.0" }
ethers-providers = { version = "2.0", features = ["ws", "rustls"] }
async-trait = "0.1.68"
futures-lite = "1.12.0"
chrono = "0.4.31"

[dev-dependencies]
tracing-test = "0.2.4"

[features]
use_pulse = []
