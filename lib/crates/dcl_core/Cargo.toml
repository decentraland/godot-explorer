[package]
name = "dcl_core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "time", "macros", "net", "sync", "fs", "io-util"] }
tracing = "0.1"
uniffi = { version = "=0.31", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.92", features = ["raw_value"] }
anyhow = "1.0.70"
url = "2.5"
once_cell = "1.16.0"
uuid = { version = "1.3.0", features = ["v4"] }
http = "0.2.9"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli"] }
rand = "0.8"
ethers-core = { version = "2.0" }
ethers-signers = { version = "2.0" }
ethers-providers = { version = "2.0", features = ["ws", "rustls"] }
async-trait = "0.1.68"
sha2 = "0.10"
base64 = "0.21.5"
futures-lite = "1.12.0"
chrono = "0.4.31"
prost = "0.11.8"
tokio-util = "0.7"
futures-util = "0.3.30"
dcl-rpc = { git = "https://github.com/decentraland/rpc-rust", rev = "aa2302d6918e2d1c7f2e298aa972d8a6bba6c389", features = ["client", "websockets", "codegen", "server", "tungstenite-rustls"] }

[build-dependencies]
prost-build = "0.11.8"
dcl-rpc = { git = "https://github.com/decentraland/rpc-rust", rev = "aa2302d6918e2d1c7f2e298aa972d8a6bba6c389", features = ["client", "websockets", "codegen", "server", "tungstenite-rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.1"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[dev-dependencies]
tracing-test = "0.2.4"
tempfile = "3"
tokio = { version = "1.40.0", features = ["test-util"] }

[features]
use_pulse = []
# The typed FFI the RN shell and the native hosts call; exported from libdclgodot (D-6).
ffi = ["dep:uniffi"]
