name: Set Prod Flag
description: Set PROD_FLAG environment variable based on the current branch (--prod for any release* branch, --staging for main and other branches)

inputs:
  ref:
    description: 'Override ref to check (defaults to github.ref). Accepts both refs/heads/release* and bare release* formats.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set prod/staging flag and branch name
      shell: bash
      # Git allows `$`, `(`, `)` and `;` in branch names, so they only ever reach the shell
      # through the environment, never as script text.
      env:
        REF_INPUT: ${{ inputs.ref }}
        GH_REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -eu
        REF="${REF_INPUT:-$GH_REF}"
        # Any branch whose name starts with "release" is a prod build
        # (e.g. release, release-1.10, release/1.10). Accepts both the
        # refs/heads/<branch> and bare <branch> forms.
        case "$REF" in
          refs/heads/release* | release*) FLAG=--prod ;;
          *) FLAG=--staging ;;
        esac
        # Prefer the explicit ref input (an on-demand rebuild of a specific branch, where the
        # triggering event's ref is unrelated), then head_ref (the PR source branch), then ref_name.
        BRANCH="${REF_INPUT#refs/heads/}"
        BRANCH="${BRANCH:-${HEAD_REF:-$REF_NAME}}"
        {
          echo "PROD_FLAG=$FLAG"
          printf 'BRANCH_NAME=%s\n' "$BRANCH"
        } >> "$GITHUB_ENV"
        echo "PROD_FLAG=$FLAG BRANCH_NAME=$BRANCH (ref=$REF)"
