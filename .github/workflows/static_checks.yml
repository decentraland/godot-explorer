name: 📊 Static Checks
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-static
  cancel-in-progress: true

jobs:
  static-checks:
    name: Code style and file formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No GDScript in the engine project
        run: |
          set -eu
          FOUND=$(find godot/src -name '*.gd')
          if [ -n "$FOUND" ]; then
            echo "::error::GDScript is not allowed under godot/src (the engine is Rust; the screens are React Native):"
            echo "$FOUND"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.94"
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: cargo fmt
        working-directory: lib
        run: cargo fmt --all -- --check

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Rust dependency licences
        working-directory: lib
        run: cargo deny check licenses

      - name: WebSocket JS shim unit tests
        run: node --test lib/crates/dcl_engine/src/dcl/js/js_modules/ws.test.cjs
