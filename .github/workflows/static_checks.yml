name: 📊 Static Checks
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-static
  cancel-in-progress: true

jobs:
  static-checks:
    name: Code style and file formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No new .gd files (plan rule 1)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          NEW_GD=$(git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.gd')
          if [ -n "$NEW_GD" ]; then
            echo "::error::New GDScript files are not allowed on this branch (new behaviour goes to RN or Rust):"
            echo "$NEW_GD"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.94"
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gdtoolkit 4
        run: pip3 install git+https://github.com/dcl-regenesislabs/godot-gdscript-toolkit.git

      - name: Check format GDScript
        run: gdformat -d godot/

      - name: GDScript Linter
        run: gdlint godot/

      - name: cargo fmt
        working-directory: lib
        run: cargo fmt --all -- --check

      - name: i18n tooling unit tests
        run: python3 -m unittest discover -s tools/i18n -p 'test_*.py'

      - name: Check translation catalogues
        run: python3 tools/i18n/format_csv.py --check

      - name: Check UI strings are keyed
        run: python3 tools/i18n/extract_strings.py --check

      - name: WebSocket JS shim unit tests
        run: node --test lib/crates/dcl_engine/src/dcl/js/js_modules/ws.test.cjs
