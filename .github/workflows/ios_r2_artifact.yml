name: 🍏 iOS → R2 (unsigned export)

# Builds the iOS app (Rust lib + Godot export) and publishes the UNSIGNED export tree to
# the R2 mobile-artifacts bucket. A separate deploy repo pulls this artifact, signs it,
# sets the build number and uploads to TestFlight — so this repo holds NO Apple signing
# material and NO App Store Connect keys.
#
# Build and publish are separate jobs: `build` compiles the commit under test and holds no
# secrets; `publish` runs under the `mobile-release` environment, executes no project code and
# only handles the bytes `build` handed over as an artifact.
on:
  # Called by mobile_distribute.yml (the `build` label / release / cron orchestrator).
  workflow_call:
    inputs:
      ref:
        description: 'Branch name (drives the prod flag)'
        required: true
        type: string
      sha:
        description: 'Commit SHA to check out and key the R2 upload by'
        required: false
        type: string
        default: ''
      r2_segment:
        description: >
          Trusted R2 key segment (main | release | release-x | pr-N), computed by the caller from
          event data. Empty (manual dispatch) → derived from `ref`, which must then be main or
          release*.
        required: false
        type: string
        default: ''
      build_number:
        description: 'Store build number allocated by the caller (baked into the export and the R2 sidecar)'
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: string
        default: ''
      slack_channel:
        required: false
        type: string
        default: ''
      slack_ts:
        required: false
        type: string
        default: ''
      dispatch_deploy:
        description: 'After the export lands in R2, trigger godot-asc-deploy to sign + upload'
        required: false
        type: boolean
        default: false
      triggered_by:
        required: false
        type: string
        default: ''
      whats_new:
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build only — skip the R2 upload, deploy dispatch and Sentry (for timing)'
        required: false
        type: boolean
        default: false
    outputs:
      build_version:
        description: 'Rust .build.version captured during the iOS lib build'
        value: ${{ jobs.publish.outputs.build_version }}
  # Manual iteration (registers once this file is on the default branch).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build & publish (main or release*)'
        required: true
        type: string
        default: 'main'
      dry_run:
        description: 'Build only — skip the R2 upload, deploy dispatch and Sentry (for timing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-r2-${{ github.actor }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS export
    # iOS can only be compiled on macOS. Matches ios_builds.yml's runner; if WarpBuild is
    # dropped for this repo too, swap to the GitHub-hosted `macos-26` image.
    runs-on: warp-macos-26-arm64-6x
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # build.rs bakes this into the version string and `cargo run -- export` stamps it as
      # CFBundleVersion, so it must be in the environment before the lib build.
      DCL_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha || inputs.ref }}
          persist-credentials: false

      # This job runs the commit under test; none of the release material may be reachable from
      # it. Fails loudly if the workflow is ever edited to pass one of these in again.
      - name: Assert build isolation (no release secrets in this job)
        run: |
          for v in ASC_DEPLOY_DISPATCH_TOKEN SENTRY_AUTH_TOKEN SLACK_BOT_TOKEN SLACK_CHANNEL \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                   MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY \
                   BUILD_NUMBER_SECRET GH_TOKEN GITHUB_TOKEN; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v must never be present in the build job"
              exit 1
            fi
          done
          echo "✅ build job holds no release secrets"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.90"
          targets: aarch64-apple-ios

      # Cache the Rust dep compilation (host + iOS) so we don't rebuild the whole tree every
      # run. WarpBuild-native cache (handles the large iOS target; runner is WarpBuild).
      # Restore runs on every branch; the save (below) only writes on main, so PRs restore from
      # main's cache without paying the multi-minute save on each push.
      - name: Set up build cache
        id: cache
        uses: ./.github/actions/set-up-warp-cache
        with:
          cache-name: ios-r2-build

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cargo install
        timeout-minutes: 15
        run: cargo run -- install --targets ios

      - name: Set prod flag
        uses: ./.github/actions/set-prod-flag
        with:
          ref: ${{ inputs.ref }}

      # The Godot export is consumed (re-archived) by the deploy repo; build the dylib
      # against the iOS 26 SDK so the final archive there satisfies Apple's SDK floor.
      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          XCODE_APP="/Applications/Xcode_26.4.1.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$XCODE_APP" ] || [ ! -d "$XCODE_APP" ]; then
            echo "❌ No Xcode 26 found on the runner. Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null
            exit 1
          fi
          echo "Using $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version

      # $PROD_FLAG is read from the process environment: this job can write $GITHUB_ENV, so its
      # values are never templated back into script text.
      - name: Build MacOS
        timeout-minutes: 20
        run: cargo run -- build --release ${PROD_FLAG:+"$PROD_FLAG"}

      - name: Build iOS
        timeout-minutes: 20
        run: cargo run -- build --release --target ios ${PROD_FLAG:+"$PROD_FLAG"}

      # Persist the freshly built target/ — no-op off a push to main (see save-warp-cache).
      - name: Save build cache (main only)
        uses: ./.github/actions/save-warp-cache
        with:
          cargo-key: ${{ steps.cache.outputs.cargo-key }}
          rust-key: ${{ steps.cache.outputs.rust-key }}

      - name: Import Assets
        uses: ./.github/actions/import-assets

      # The iOS export bakes shaders (export_presets.cfg `shader_baker/enabled=true`): Godot compiles them
      # to .metallib through `xcrun metal`, which Xcode 26 ships as a separately downloaded component.
      # Without it the baker silently falls back to SPIR-V only and the device compiles every shader on
      # its main thread at first draw. `cargo run -- export` fails the build if that happens.
      - name: Ensure Metal toolchain (shader baker)
        run: |
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain missing — downloading the Xcode 26 component…"
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version

      # Windowed editor (not --headless) so the shader baker has a RenderingDevice; the runner's GUI
      # session is required. Baking + Metal compilation is what the longer timeout pays for.
      - name: Export
        timeout-minutes: 25
        run: cargo run -- export --target ios --release

      # Everything publish needs, so it never has to check out or run this commit: the export tree
      # (Xcode project + embedded libdclgodot.dylib + assets, re-archived by the deploy repo), the
      # dylib for Sentry with a sources bundle built here where the sources are, and the version
      # strings build.rs wrote.
      - name: Collect handoff artifact
        run: |
          set -eu
          if [ ! -d exports ]; then
            echo "❌ exports/ not found — the Godot iOS export did not run"
            exit 1
          fi
          echo "exports/ contents:"; ls -la exports/
          echo "dylibs found:"; find exports -name "*.dylib" 2>/dev/null || true
          mkdir -p handoff/symbols handoff/meta
          tar -czf handoff/export.tar.gz -C exports .
          echo "Export tarball size: $(du -h handoff/export.tar.gz | cut -f1)"
          cp lib/target/libdclgodot_ios/libdclgodot.dylib handoff/symbols/ || echo "⚠️  libdclgodot.dylib not found"
          cp .build.version handoff/meta/explorer_version.txt
          cp .build.sentry_release handoff/meta/sentry_release.txt
          if curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.7.0 bash; then
            sentry-cli debug-files bundle-sources handoff/symbols/libdclgodot.dylib || true
          fi
          ls -la handoff handoff/symbols handoff/meta

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: handoff/
          retention-days: 3
          if-no-files-found: error

  # Publish the unsigned export to R2, hand it to godot-asc-deploy and register the Sentry
  # release. Runs only trusted code (the base branch's scripts and actions) on the artifact bytes,
  # after validating every value that crossed over from the build job.
  publish:
    name: Publish iOS export → R2
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile-release
    permissions:
      contents: read
      pull-requests: write   # PR status card (pr-card.py) when called from mobile_distribute with a pr_number
    outputs:
      build_version: ${{ steps.validate.outputs.build_version }}
    env:
      # Trusted values only: event data and caller inputs, never anything the build job produced.
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ inputs.ref }}
      SHA: ${{ inputs.sha || github.sha }}
      R2_SEGMENT_INPUT: ${{ inputs.r2_segment }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PR_NUMBER: ${{ inputs.pr_number }}
      SLACK_TS: ${{ inputs.slack_ts }}
      RUN_ID: ${{ github.run_id }}   # a called workflow shares the caller's run id
      R2_PUBLIC_BASE_URL: "https://mobile-artifacts.dclregenesislabs.xyz"
    steps:
      # Trusted ref (the pushed commit, or the base branch under pull_request_target): only the
      # scripts and local actions are used from it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned
          path: handoff

      - name: Validate segment and handoff metadata
        id: validate
        run: |
          set -eu
          R2_SEGMENT="${R2_SEGMENT_INPUT:-$(echo "$REF" | tr '/' '-')}"
          case "$R2_SEGMENT" in
            main|release|release-[A-Za-z0-9._-]*|pr-[0-9]*) ;;
            *) echo "::error::refusing to publish under R2 segment '$R2_SEGMENT'"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            case "$R2_SEGMENT" in
              pr-*) ;;
              *) echo "::error::PR distributions may only publish under pr-<N>"; exit 1 ;;
            esac
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha '$SHA'"; exit 1; }
          [[ -z "$BUILD_NUMBER" || "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad build number '$BUILD_NUMBER'"; exit 1; }
          EXPLORER_VERSION=$(tr -d '[:space:]' < handoff/meta/explorer_version.txt)
          SENTRY_RELEASE=$(tr -d '[:space:]' < handoff/meta/sentry_release.txt)
          [[ "$EXPLORER_VERSION" =~ ^[0-9A-Za-z.+_-]{1,80}$ ]] || { echo "::error::bad explorer version"; exit 1; }
          [[ "$SENTRY_RELEASE" =~ ^[0-9A-Za-z.+_-]{1,80}$ ]] || { echo "::error::bad sentry release"; exit 1; }
          [ -f handoff/export.tar.gz ] || { echo "::error::export.tar.gz missing from the handoff"; exit 1; }
          {
            echo "R2_SEGMENT=$R2_SEGMENT"
            echo "EXPLORER_VERSION=$EXPLORER_VERSION"
            echo "SENTRY_RELEASE=$SENTRY_RELEASE"
          } >> "$GITHUB_ENV"
          echo "build_version=$EXPLORER_VERSION" >> "$GITHUB_OUTPUT"
          echo "segment=$R2_SEGMENT sha=$SHA build=$BUILD_NUMBER version=$EXPLORER_VERSION"

      - name: Upload unsigned export to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
          AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
        run: |
          set -eu
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_S3_BUCKET:-}" ] || [ -z "${AWS_ENDPOINT_URL:-}" ]; then
            echo "::error::MOBILE_ARTIFACTS_R2_* secrets are not set in the mobile-release environment"
            exit 1
          fi

          KEY="ios/${R2_SEGMENT}/${SHA}/export.tar.gz"
          LATEST_KEY="ios/${R2_SEGMENT}/latest/export.tar.gz"

          echo "📤 Uploading export to s3://${AWS_S3_BUCKET}/${KEY}"
          aws s3 cp handoff/export.tar.gz "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          # Update the 'latest' pointer WITHOUT re-uploading the tarball. The managed
          # `aws s3 cp s3:// s3://` is unusable on R2 (it sends GetObjectTagging / x-amz-tagging-
          # directive, both NotImplemented), so use the low-level copy-object; fall back to a plain
          # re-upload if R2 ever rejects the copy, so the build never breaks. asc-deploy's manual
          # dispatch defaults to ios/<branch>/latest, so this key must stay populated.
          echo "🔗 Updating latest pointer s3://${AWS_S3_BUCKET}/${LATEST_KEY}"
          aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_KEY" \
            --copy-source "${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
            || aws s3 cp handoff/export.tar.gz "s3://${AWS_S3_BUCKET}/${LATEST_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"

          # Sidecar: the build number this export was BAKED with, next to the tarball. The deploy
          # orchestrator (mobile_distribute ios-resolve) compares it against a fresh allocation before
          # reusing this export — if the allocator has since bumped the number (a store shipped past
          # it), the export is stale and must be rebuilt, not reused/shipped.
          if [ -n "$BUILD_NUMBER" ]; then
            BUILD_NUMBER_KEY="ios/${R2_SEGMENT}/${SHA}/build_number.txt"
            LATEST_BUILD_NUMBER_KEY="ios/${R2_SEGMENT}/latest/build_number.txt"
            printf '%s' "$BUILD_NUMBER" > build_number.txt
            echo "🔢 Writing build_number sidecar ($BUILD_NUMBER) → s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}"
            aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
            aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_BUILD_NUMBER_KEY" \
              --copy-source "${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
              || aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${LATEST_BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          else
            echo "ℹ️  no build number — no build_number sidecar."
          fi

          echo "✅ Unsigned export uploaded to R2 (sha=${SHA}, segment=${R2_SEGMENT})"
          echo "🔗 ${R2_PUBLIC_BASE_URL}/${KEY}"

      - name: Slack — iOS export uploaded
        if: success() && env.SLACK_TS != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          bash .github/scripts/slack-reply.sh "📦 iOS — unsigned export uploaded to R2 ✓ (${REF})"

      - name: Root — iOS exported
        if: success() && env.SLACK_TS != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          # Not done yet → no green tick. The ✅ only appears when it's on TestFlight.
          IOS_LINE: "📦 exported to R2 · signing…"
          BUILD_VERSION: ${{ steps.validate.outputs.build_version }}
        run: |
          python3 .github/scripts/slack-root.py

      - name: PR card — iOS exported
        if: success() && env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_LINE: "📦 exported to R2 · signing…"
          BUILD_VERSION: ${{ steps.validate.outputs.build_version }}
          LOG: "📦 iOS — unsigned export uploaded to R2 ✓"
        run: |
          python3 .github/scripts/pr-card.py

      # Hand off to the signing/upload pipeline AS SOON as the export is in R2, so the deploy
      # runs in parallel with the (best-effort) Sentry upload below instead of waiting for it.
      # `ref` is the validated R2 segment: asc-deploy reconstructs the key from it and names its
      # run `🍏 <segment> @ <sha>`, which mobile_distribute's ios-wait matches.
      - name: Dispatch godot-asc-deploy (sign & upload to TestFlight)
        if: success() && inputs.dispatch_deploy
        uses: ./.github/actions/dispatch-asc-deploy
        with:
          gh-token: ${{ secrets.ASC_DEPLOY_DISPATCH_TOKEN }}
          ref: ${{ env.R2_SEGMENT }}
          sha: ${{ env.SHA }}
          whats_new: ${{ inputs.whats_new }}
          pr_number: ${{ inputs.pr_number }}
          slack_ts: ${{ inputs.slack_ts }}
          build_version: ${{ steps.validate.outputs.build_version }}
          build_number: ${{ inputs.build_number }}
          triggered_by: ${{ inputs.triggered_by }}

      - name: Slack — handed off to signing
        if: success() && inputs.dispatch_deploy && env.SLACK_TS != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          bash .github/scripts/slack-reply.sh "🤝 iOS — export handed off to the signing pipeline (godot-asc-deploy)"

      - name: PR card — handed off to signing
        if: success() && inputs.dispatch_deploy && env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG: "🤝 iOS — export handed off to the signing pipeline (godot-asc-deploy)"
        run: |
          python3 .github/scripts/pr-card.py

      - name: Slack — handoff failed
        if: failure() && inputs.dispatch_deploy && env.SLACK_TS != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          bash .github/scripts/slack-reply.sh "❌ iOS — failed to hand off to the signing pipeline (check ASC_DEPLOY_DISPATCH_TOKEN)"

      # The iOS line itself flips to ❌ in mobile_distribute's root-failed job (this job fails).
      - name: PR card — handoff failed
        if: failure() && inputs.dispatch_deploy && env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG: "❌ iOS — failed to hand off to the signing pipeline (check ASC_DEPLOY_DISPATCH_TOKEN)"
        run: |
          python3 .github/scripts/pr-card.py

      # `sentry-cli releases set-commits` needs the built commit's git tree. It is only read,
      # never executed.
      - name: Check out the built commit (read-only, for Sentry)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SHA }}
          path: built-commit
          persist-credentials: false

      # libdclgodot.dylib is BUILT in this workflow, so its dSYM must be uploaded to Sentry from
      # here (the deploy repo only re-archives the already-built dylib). Best-effort.
      # continue-on-error: a Sentry hiccup (e.g. server-side "Reported checksum mismatch")
      # must never fail a build whose export already reached R2 — it only costs us
      # symbolication. We notify instead.
      - name: Upload libdclgodot to Sentry
        id: sentry_libdclgodot
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "⚠️  Sentry secrets not configured, skipping libdclgodot dSYM upload"; exit 0
          fi
          command -v sentry-cli >/dev/null 2>&1 || curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.7.0 bash
          LIBDCLGODOT_PATH="handoff/symbols/libdclgodot.dylib"
          if [ -f "$LIBDCLGODOT_PATH" ]; then
            sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --wait "$LIBDCLGODOT_PATH"
            if [ -f "${LIBDCLGODOT_PATH}.src.zip" ]; then
              sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --wait "${LIBDCLGODOT_PATH}.src.zip"
            fi
            echo "✅ libdclgodot uploaded to Sentry"
          else
            echo "⚠️  libdclgodot not found at $LIBDCLGODOT_PATH"
          fi
          # Register the release under the exact string the runtime reports (lib/build.rs), so
          # iOS issues get "first seen in" / suspect commits like Android. The iOS build number
          # is allocated separately, so this is its own release.
          SENTRY_RELEASE="org.decentraland.godotexplorer@${SENTRY_RELEASE}"
          case "$REF" in
            refs/heads/release*|release*) SENTRY_ENV=production ;;
            *) SENTRY_ENV=staging ;;
          esac
          sentry-cli releases new "$SENTRY_RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          ( cd built-commit && \
            sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --auto --ignore-missing \
            || sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --local --ignore-missing \
            || echo "⚠️  could not associate commits with $SENTRY_RELEASE" )
          sentry-cli releases finalize "$SENTRY_RELEASE" --org "$SENTRY_ORG"
          sentry-cli releases deploys "$SENTRY_RELEASE" new --org "$SENTRY_ORG" -e "$SENTRY_ENV"
          echo "✅ Sentry release $SENTRY_RELEASE finalized ($SENTRY_ENV)"

      # Notify only — the step above is continue-on-error, so the job stays green.
      - name: Sentry libdclgodot upload failed — notify (non-blocking)
        if: always() && steps.sentry_libdclgodot.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning title=Sentry libdclgodot upload failed::iOS native symbols for ${REF} were not uploaded — crashes may be unsymbolicated. The build itself is unaffected."
          bash .github/scripts/slack-reply.sh "⚠️ iOS — Sentry libdclgodot symbol upload failed (non-blocking), build unaffected — ${RUN_URL}"
