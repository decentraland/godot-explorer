# THROWAWAY: fast-iteration harness for the Firebase App Distribution auth fix.
# Pulls the already-built public APK from R2 (no rebuild) and distributes via the
# App Distribution REST API using a WIF-minted access token (firebase-tools can't read
# WIF/external_account ADC). Delete once the logic is ported to mobile_distribute.yml.
name: 🧪 test firebase distribute
on:
  # push-triggered (workflow_dispatch only works from the default branch). Scoped to this
  # throwaway file so it only runs when I iterate on it — not on unrelated pushes.
  push:
    branches: [ci/firebase-app-distribution]
    paths: ['.github/workflows/test_firebase_distribute.yml']
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  test-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF → access token)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Download APK from R2
        run: |
          curl -fsSL "https://mobile-artifacts.dclregenesislabs.xyz/android/ci-firebase-app-distribution/latest/decentraland.godot.client.apk" -o app.apk
          ls -la app.apk

      - name: Distribute via App Distribution REST API
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'qa' }}
          PROJECT_NUMBER: '300605090472'
        run: |
          set -euo pipefail
          BASE=https://firebaseappdistribution.googleapis.com

          echo "▶️  Uploading APK…"
          UP=$(curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: app.apk" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app.apk \
            "${BASE}/upload/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases:upload")
          echo "upload response: $UP"
          OP=$(echo "$UP" | jq -r '.name // empty')
          if [ -z "$OP" ]; then echo "❌ no operation name in upload response"; exit 1; fi

          echo "▶️  Polling operation $OP …"
          REL=""
          for i in $(seq 1 40); do
            R=$(curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" "${BASE}/v1/${OP}")
            if [ "$(echo "$R" | jq -r '.done // false')" = "true" ]; then
              echo "operation done: $R"
              REL=$(echo "$R" | jq -r '.response.release.name // empty')
              break
            fi
            sleep 5
          done
          if [ -z "$REL" ]; then echo "❌ no release name (operation not done or error)"; exit 1; fi
          echo "✅ Release: $REL"

          echo "▶️  Distributing to groups: $GROUPS"
          GJSON=$(echo "$GROUPS" | jq -R 'split(",")')
          DIST=$(curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"groupAliases\": ${GJSON}}" \
            "${BASE}/v1/${REL}:distribute")
          echo "distribute response: $DIST"
          if echo "$DIST" | jq -e '.error' >/dev/null 2>&1; then echo "❌ distribute error"; exit 1; fi
          echo "✅ done — release distributed to: $GROUPS"
