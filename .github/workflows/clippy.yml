name: 🔧 Clippy & Build Checks
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-clippy
  cancel-in-progress: true

jobs:
  clippy:
    name: Cargo check, clippy and version check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT4_BIN: ${{ github.workspace }}/.bin/godot/godot4_bin
      PROTOC: ${{ github.workspace }}/.bin/protoc/bin/protoc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.94"
          components: clippy

      - name: Set up cache
        uses: ./.github/actions/set-up-cache

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: cargo install
        run: cargo run -- install --no-templates

      # asset_server is only built by the Docker image (main/release); check it here so PRs catch it.
      - name: cargo check
        working-directory: lib
        run: cargo check --workspace --features dclgodot/asset_server

      - name: cargo clippy
        working-directory: lib
        run: cargo clippy --workspace --features dclgodot/asset_server -- -D warnings

      - name: dcl_core and dcl_host tests (no Godot)
        working-directory: lib
        run: cargo test -p dcl_core -p dcl_host

      - name: Version check
        run: cargo run -- version-check

      - name: Check asset imports
        run: python3 tests/check_asset_imports.py
