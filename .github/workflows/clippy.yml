name: 🔧 Clippy & Build Checks
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-clippy
  cancel-in-progress: true

jobs:
  clippy:
    name: Cargo check, clippy and version check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT4_BIN: ${{ github.workspace }}/.bin/godot/godot4_bin
      PROTOC: ${{ github.workspace }}/.bin/protoc/bin/protoc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.90"
          components: clippy

      - name: Set up cache
        uses: ./.github/actions/set-up-cache

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: cargo install
        run: cargo run -- install --no-templates

      - name: cargo check
        working-directory: lib
        run: cargo check

      - name: cargo clippy
        working-directory: lib
        run: cargo clippy -- -D warnings

      - name: cargo clippy (enable_inspector)
        working-directory: lib
        run: cargo clippy --features enable_inspector -- -D warnings

      - name: TLS crates in the lockfiles
        # Floors: rustls 0.23.46 (Oct 2026 advisories), rustls-webpki 0.103.16 and webpki-roots
        # 1.0.10 (eMudhra distrust). webpki-roots 0.26.11 is only a shim over 1.x. The old
        # `webpki` verifier has no distrust list at all.
        run: |
          old=$(awk '/^name = "(rustls|rustls-webpki|webpki|webpki-roots)"$/ { name = $3; getline; print FILENAME, name, $3 }' Cargo.lock lib/Cargo.lock \
            | tr -d '"' \
            | while read -r file name version; do
                if [ "$name" = webpki ]; then
                  echo "$file webpki $version (use rustls-webpki)"
                  continue
                fi
                floor=0.103.16
                [ "$name" = rustls ] && floor=0.23.46
                [ "$name" = webpki-roots ] && floor=1.0.10
                [ "$name" = webpki-roots ] && [ "${version%.*}" = 0.26 ] && floor=0.26.11
                if [ "$(printf '%s\n' "$floor" "$version" | sort -V | head -n1)" != "$floor" ]; then
                  echo "$file $name $version (needs >= $floor)"
                fi
              done)
          if [ -n "$old" ]; then
            echo "::error::TLS crates below the security floor in a lockfile:"
            echo "$old"
            exit 1
          fi

      - name: Version check
        run: cargo run -- version-check

      - name: Check asset imports
        run: python3 tests/check_asset_imports.py
