name: 🤖 Android
# Build and sign are separate jobs. `build` checks out and compiles the commit under test (PR head
# or pushed sha) and holds NO secrets. `sign-publish` runs only outside pull_request events, under
# the `mobile-release` environment (deployment branches main / release / release-*), executes no
# project code, and only ever touches the bytes `build` handed over as an artifact.
on:
  workflow_call:
    inputs:
      # All optional so the push path (runner.yml) keeps calling this with no `with:` block.
      # mobile_distribute passes them to rebuild a specific commit on demand.
      ref:
        description: >
          Branch/ref to build (drives the prod flag). Empty → defaults to the triggering event's
          branch.
        required: false
        type: string
        default: ''
      sha:
        description: >
          Commit SHA to check out, allocate the build number for, and key the R2 upload by.
          Empty → defaults to the triggering event's head SHA.
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >
          Overrides the concurrency-group discriminator so an on-demand rebuild (mobile_distribute)
          does not share a group with — and cancel — the push-triggered Android build for the same
          actor/ref. Empty keeps the default push behavior.
        required: false
        type: string
        default: ''
      r2_segment:
        description: >
          Trusted R2 key segment (main | release | release-x | pr-N), computed by the caller from
          event data, never from a branch name. Empty on push → github.ref_name.
        required: false
        type: string
        default: ''
      build_number:
        description: >
          Pre-allocated store build number (mobile_distribute's prepare job). Empty → the
          `allocate` job allocates one (push events only).
        required: false
        type: string
        default: ''
      publish_aab:
        description: Export, sign and publish the Play Store AAB (main / release* only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # `inputs.concurrency_key` (set by mobile_distribute's on-demand rebuild) isolates that run from
  # the push-triggered build so the two don't cancel each other; falls back to the original key.
  group: ci-${{ github.actor }}-${{ inputs.concurrency_key || github.head_ref || github.run_number }}-${{ github.ref }}-android
  cancel-in-progress: true

jobs:
  # The store build number is allocated under the environment so the allocator key never reaches
  # the build job. Skipped on PRs (placeholder versionCode, never shipped) and when the caller
  # already allocated one.
  allocate:
    name: Allocate build number
    if: github.event_name != 'pull_request' && inputs.build_number == ''
    runs-on: ubuntu-latest
    environment: mobile-release
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.n.outputs.build-number }}
    steps:
      # Trusted ref (the pushed commit, or the base branch under pull_request_target): only the
      # local composite action is run from it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: n
        uses: ./.github/actions/compute-build-number
        with:
          sha: ${{ inputs.sha || github.sha }}
          secret: ${{ secrets.BUILD_NUMBER_SECRET }}
          allocated-by: android

  build:
    name: Build Android
    needs: allocate
    if: always() && (needs.allocate.result == 'success' || needs.allocate.result == 'skipped')
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 35
    permissions:
      contents: read
    container:
      # image generated at: https://github.com/decentraland/godot-docker-builder
      image: quay.io/decentraland/dcl-godot-android-builder:394c180223d3e2ad410d191147e9e2ad39884c0b
      volumes:
        - /home/user/.cache/devgodot:/github/home/.cache/devgodot
      # WarpBuild's cache action authenticates via this token, which exists on the runner
      # host but is NOT propagated into the container unless forwarded explicitly. Without
      # it the cache step is a silent no-op ("Authentication token is invalid"). See:
      # https://github.com/WarpBuilds/cache#running-inside-a-container
      env:
        WARPBUILD_RUNNER_VERIFICATION_TOKEN: ${{ env.WARPBUILD_RUNNER_VERIFICATION_TOKEN }}
    env:
      # build.rs bakes this into the version string and `cargo run -- export` stamps it as the
      # versionCode, so it must be in the environment before the lib build.
      DCL_BUILD_NUMBER: ${{ inputs.build_number || needs.allocate.outputs.build_number }}
      PUBLISH_AAB: ${{ inputs.publish_aab }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # This job runs the commit under test; none of the release material may be reachable from
      # it. Fails loudly if the workflow is ever edited to pass one of these in again.
      - name: Assert build isolation (no release secrets in this job)
        shell: bash
        run: |
          for v in APK_ANDROID_KEYSTORE_BASE64 APK_ANDROID_KEYSTORE_PASSWORD \
                   ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                   ASC_DEPLOY_DISPATCH_TOKEN SENTRY_AUTH_TOKEN SLACK_BOT_TOKEN \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                   MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY \
                   BUILD_NUMBER_SECRET; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v must never be present in the build job"
              exit 1
            fi
          done
          echo "✅ build job holds no release secrets"

      - name: Add safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      # Cache the Rust build (host + Android target) so the dep tree isn't recompiled from
      # scratch every push. Use the WarpBuild-native cache (raw target/, NO cleaning): the v8
      # crate's prebuilt static lib (librusty_v8.a) lives under target/.../build/v8-*/out, and
      # rust-cache's cleanup strips it while keeping v8's fingerprint → warm builds then fail to
      # link. set-up-warp-cache keeps the full target/, so the lib survives (matches the iOS leg).
      # Restore runs on every branch; the save (below) only writes on main, so PRs restore from
      # main's cache without paying the multi-minute save on each push.
      # WarpBuild's cache action shells out to wget; the builder image may not ship it.
      - name: Ensure wget (WarpCache dependency)
        run: command -v wget >/dev/null 2>&1 || (apt-get update && apt-get install -y wget)
      - name: Set up build cache
        id: cache
        uses: ./.github/actions/set-up-warp-cache
        with:
          cache-name: android-build

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android
      - name: Cargo install
        run: cargo run -- install --targets android linux

      # Pass the real branch so release* PRs / on-demand rebuilds bake --prod: `inputs.ref` when
      # mobile_distribute rebuilds a specific commit, `head_ref` on PR events (where github.ref is
      # refs/pull/N/merge and would always map to --staging). Both empty on plain pushes → the
      # action falls back to github.ref, unchanged behavior.
      - name: Set prod flag
        uses: ./.github/actions/set-prod-flag
        with:
          ref: ${{ inputs.ref || github.head_ref }}

      # $PROD_FLAG is read from the process environment: this job can write $GITHUB_ENV, so its
      # values are never templated back into script text.
      - name: Build Rust libraries
        run: |
          cargo run -- build --release ${PROD_FLAG:+"$PROD_FLAG"}
          cargo run -- build --release --target android ${PROD_FLAG:+"$PROD_FLAG"}
          cargo run -- import-assets

      # Persist the freshly built target/ — no-op off a push to main (see save-warp-cache). Placed
      # right after the build so a later export failure can't lose a valid cache.
      - name: Save build cache (main only)
        uses: ./.github/actions/save-warp-cache
        with:
          cargo-key: ${{ steps.cache.outputs.cargo-key }}
          rust-key: ${{ steps.cache.outputs.rust-key }}

      # The export signs the APK with the throwaway keystore xtask generates; the distribution
      # key is applied in sign-publish.
      - name: Export Android APK
        run: |
          cargo run -- export --target android --format apk --release
          mkdir -p android-debug-symbols
          cp godot/android/build/build/outputs/native-debug-symbols/standardRelease/native-debug-symbols.zip android-debug-symbols/ || true

      # The AAB is the Play Store artifact — only built for main/release* (trusted caller input).
      - name: Export Android AAB
        if: env.PUBLISH_AAB == 'true'
        run: |
          cargo run -- export --target android --format aab --release

      # Play Console symbolicates native crashes from the symbols AGP embeds in the bundle
      # (debugSymbolLevel FULL in the engine's gradle template). Warn, don't fail, if they are
      # missing: the bundle still ships, but the store's crash view would be unreadable.
      - name: Check AAB carries native debug symbols
        if: env.PUBLISH_AAB == 'true'
        shell: bash
        run: |
          AAB=$(ls exports/*.aab | head -1)
          if unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols"; then
            echo "✅ $AAB includes native debug symbols"
          else
            echo "::warning title=AAB without native debug symbols::$AAB has no BUNDLE-METADATA/com.android.tools.build.debugsymbols entry - Play Console crash stacks will be unreadable."
          fi

      # Everything sign-publish needs, so it never has to check out or run this commit: the
      # throwaway-signed APK/AAB, the shipped native libs for Sentry (with a sources bundle, built
      # here where the sources are), and the version strings build.rs wrote.
      - name: Collect handoff artifact
        run: |
          set -eu
          mkdir -p handoff/symbols handoff/meta
          mv exports/decentraland.godot.client.apk handoff/
          if [ "$PUBLISH_AAB" = "true" ]; then
            mv exports/decentraland.godot.client.aab handoff/
          fi
          cp lib/target/libdclgodot_android/libdclgodot.so handoff/symbols/
          # The engine library from the AAR. (build/outputs/native-debug-symbols is not usable:
          # Godot's export runs `gradle clean` first, so the zip is gone by now.)
          GODOT_AAR="godot/android/build/libs/release/godot-lib.template_release.aar"
          if [ -f "$GODOT_AAR" ]; then
            unzip -o -q "$GODOT_AAR" "jni/arm64-v8a/libgodot_android.so" -d /tmp/godot-aar
            cp /tmp/godot-aar/jni/arm64-v8a/libgodot_android.so handoff/symbols/
          else
            echo "⚠️  Godot AAR not found at $GODOT_AAR"
          fi
          cp android-debug-symbols/native-debug-symbols.zip handoff/symbols/ 2>/dev/null || true
          cp .build.version handoff/meta/explorer_version.txt
          cp .build.sentry_release handoff/meta/sentry_release.txt
          # Pinned through SENTRY_CLI_VERSION (the install script honors it). Best-effort: the
          # upload still works without inline sources.
          if curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.7.0 bash; then
            sentry-cli debug-files bundle-sources handoff/symbols/libdclgodot.so || true
          fi
          ls -la handoff handoff/symbols handoff/meta

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: handoff/
          retention-days: 3
          if-no-files-found: error

  # Re-sign with the distribution key, sign the AAB with the Play upload key, publish to R2 and
  # Sentry. Runs no project code: only apksigner/jarsigner/aws/sentry-cli on the artifact bytes,
  # after validating every value that crossed over from the build job.
  sign-publish:
    name: Sign & publish Android
    needs: [allocate, build]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: mobile-release
    permissions:
      contents: read
    env:
      # Trusted values only: event data and caller inputs, never anything the build job produced.
      EVENT_NAME: ${{ github.event_name }}
      SHA: ${{ inputs.sha || github.sha }}
      R2_SEGMENT: ${{ inputs.r2_segment || github.ref_name }}
      PUBLISH_AAB: ${{ inputs.publish_aab }}
      BUILD_NUMBER: ${{ inputs.build_number || needs.allocate.outputs.build_number }}
      PROD_FLAG_REF: ${{ inputs.ref || github.ref_name }}
      # Public R2 domain mapped to the mobile-artifacts bucket root.
      R2_PUBLIC_BASE_URL: "https://mobile-artifacts.dclregenesislabs.xyz"
      # SHA-256 digest of the distribution certificate (`apksigner verify --print-certs`). When
      # set, a signature by any other key fails the job.
      EXPECTED_CERT_SHA256: ${{ vars.APK_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: handoff

      - name: Validate segment and handoff metadata
        run: |
          set -eu
          case "$R2_SEGMENT" in
            main|release|release-[A-Za-z0-9._-]*|pr-[0-9]*) ;;
            *) echo "::error::refusing to publish under R2 segment '$R2_SEGMENT'"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            case "$R2_SEGMENT" in
              pr-*) ;;
              *) echo "::error::PR distributions may only publish under pr-<N>"; exit 1 ;;
            esac
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha '$SHA'"; exit 1; }
          [[ -z "$BUILD_NUMBER" || "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad build number '$BUILD_NUMBER'"; exit 1; }
          EXPLORER_VERSION=$(tr -d '[:space:]' < handoff/meta/explorer_version.txt)
          SENTRY_RELEASE=$(tr -d '[:space:]' < handoff/meta/sentry_release.txt)
          [[ "$EXPLORER_VERSION" =~ ^[0-9A-Za-z.+_-]{1,80}$ ]] || { echo "::error::bad explorer version"; exit 1; }
          [[ "$SENTRY_RELEASE" =~ ^[0-9A-Za-z.+_-]{1,80}$ ]] || { echo "::error::bad sentry release"; exit 1; }
          [ -f handoff/decentraland.godot.client.apk ] || { echo "::error::APK missing from the handoff"; exit 1; }
          if [ "$PUBLISH_AAB" = "true" ] && [ ! -f handoff/decentraland.godot.client.aab ]; then
            echo "::error::AAB missing from the handoff"; exit 1
          fi
          {
            echo "EXPLORER_VERSION=$EXPLORER_VERSION"
            echo "SENTRY_RELEASE=$SENTRY_RELEASE"
          } >> "$GITHUB_ENV"
          echo "segment=$R2_SEGMENT sha=$SHA build=$BUILD_NUMBER version=$EXPLORER_VERSION"

      # Re-sign the exported APK with the production distribution key so every published build
      # shares one stable signing identity (Android requires the same key across upgrades). The
      # export already signed it with a throwaway keystore, so this is a re-sign.
      - name: Re-sign APK with the distribution key
        env:
          APK_ANDROID_KEYSTORE_BASE64: ${{ secrets.APK_ANDROID_KEYSTORE_BASE64 }}
          APK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$APK_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::APK_ANDROID_KEYSTORE_BASE64 is not set in the mobile-release environment"
            exit 1
          fi
          echo "$APK_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apk.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Using build-tools: $BT"
          "${BT}zipalign" -p 4 handoff/decentraland.godot.client.apk "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" sign --ks "$RUNNER_TEMP/apk.keystore" \
            --ks-pass env:APK_ANDROID_KEYSTORE_PASSWORD \
            --out handoff/decentraland.godot.client.apk "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" verify --verbose handoff/decentraland.godot.client.apk
          GOT=$("${BT}apksigner" verify --print-certs handoff/decentraland.godot.client.apk \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "signer cert SHA-256: $GOT"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with an unexpected certificate ($GOT)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/apk.keystore" "$RUNNER_TEMP/aligned.apk"

      - name: Sign AAB with the Play upload key
        if: env.PUBLISH_AAB == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the mobile-release environment"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -signedjar handoff/decentraland.godot.client-signed.aab \
            handoff/decentraland.godot.client.aab \
            upload
          jarsigner -verify -verbose handoff/decentraland.godot.client-signed.aab
          mv handoff/decentraland.godot.client-signed.aab handoff/decentraland.godot.client.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      # Keyed by the trusted segment + commit SHA so a download can target an exact build. The
      # mobile_distribute resolve jobs reuse objects under main/release*, which only this job can
      # write.
      - name: Upload Android artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
          AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
        run: |
          set -eu
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_S3_BUCKET" ] || [ -z "$AWS_ENDPOINT_URL" ]; then
            echo "::error::MOBILE_ARTIFACTS_R2_* secrets are not set in the mobile-release environment"
            exit 1
          fi

          APK_PATH="handoff/decentraland.godot.client.apk"
          KEY="android/${R2_SEGMENT}/${SHA}/decentraland.godot.client.apk"
          LATEST_KEY="android/${R2_SEGMENT}/latest/decentraland.godot.client.apk"

          echo "📤 Uploading APK to s3://${AWS_S3_BUCKET}/${KEY}"
          aws s3 cp "$APK_PATH" "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          # Update the 'latest' pointer WITHOUT re-uploading. The managed `aws s3 cp s3:// s3://`
          # is unusable on R2 (tagging headers NotImplemented), so use low-level copy-object; fall
          # back to a plain re-upload if R2 rejects the copy.
          aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_KEY" \
            --copy-source "${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
            || aws s3 cp "$APK_PATH" "s3://${AWS_S3_BUCKET}/${LATEST_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          echo "✅ APK uploaded to R2 (sha=${SHA}, segment=${R2_SEGMENT})"
          echo "🔗 Public URL: ${R2_PUBLIC_BASE_URL}/${KEY}"

          # Sidecar: the build number this APK was BAKED with, next to it. The deploy orchestrator
          # (mobile_distribute android-resolve) compares it against the authoritative allocation
          # before reusing this APK — if the allocator has since bumped the number (a store shipped
          # past it), the APK is stale and must be rebuilt. Mirrors the iOS sidecar.
          if [ -n "$BUILD_NUMBER" ]; then
            BUILD_NUMBER_KEY="android/${R2_SEGMENT}/${SHA}/build_number.txt"
            LATEST_BUILD_NUMBER_KEY="android/${R2_SEGMENT}/latest/build_number.txt"
            printf '%s' "$BUILD_NUMBER" > build_number.txt
            echo "🔢 Writing build_number sidecar ($BUILD_NUMBER) → s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}"
            aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
            aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_BUILD_NUMBER_KEY" \
              --copy-source "${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
              || aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${LATEST_BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          else
            echo "ℹ️  no build number — no build_number sidecar."
          fi

          if [ "$PUBLISH_AAB" = "true" ]; then
            AAB_PATH="handoff/decentraland.godot.client.aab"
            AAB_KEY="android/${R2_SEGMENT}/${SHA}/decentraland.godot.client.aab"
            AAB_LATEST_KEY="android/${R2_SEGMENT}/latest/decentraland.godot.client.aab"
            echo "📤 Uploading AAB to s3://${AWS_S3_BUCKET}/${AAB_KEY}"
            aws s3 cp "$AAB_PATH" "s3://${AWS_S3_BUCKET}/${AAB_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
            aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$AAB_LATEST_KEY" \
              --copy-source "${AWS_S3_BUCKET}/${AAB_KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
              || aws s3 cp "$AAB_PATH" "s3://${AWS_S3_BUCKET}/${AAB_LATEST_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
            echo "✅ AAB uploaded to R2"
            echo "🔗 Public URL: ${R2_PUBLIC_BASE_URL}/${AAB_KEY}"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPK
          path: handoff/decentraland.godot.client.apk
          if-no-files-found: error

      - name: Upload AAB Artifacts
        if: env.PUBLISH_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAAB
          path: handoff/decentraland.godot.client.aab
          if-no-files-found: error

      - name: Upload Android Debug Symbols
        if: env.PUBLISH_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Android Native Debug Symbols
          path: handoff/symbols/native-debug-symbols.zip
          if-no-files-found: warn

      # `sentry-cli releases set-commits` and the sentry-godot symbols URL (src/consts.rs) need
      # the built commit's git tree. It is only read, never executed, and only for main/release*
      # (trusted pushes).
      - name: Check out the built commit (read-only, for Sentry)
        if: env.PUBLISH_AAB == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          path: built-commit
          persist-credentials: false

      # Upload debug symbols to Sentry and register the release, for production builds
      # (main/release* only). Only the libraries that actually ship: our Rust lib and the engine
      # lib from the AAR (unstripped there, same build-id as the stripped copy inside the APK/AAB).
      # The release must be exactly the string the runtime reports (`{version}+{build}`,
      # lib/build.rs) or Sentry sees two different releases. continue-on-error: the APK/AAB are
      # already published by this point, so a Sentry hiccup must never fail the build.
      - name: Upload debug symbols to Sentry
        id: sentry_symbols
        if: env.PUBLISH_AAB == 'true'
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_CLI_VERSION: "3.7.0"
        run: |
          set -euo pipefail
          echo "Explorer version: $EXPLORER_VERSION"
          if [[ "$EXPLORER_VERSION" =~ -dev$ ]]; then
            echo "Development build detected (-dev suffix found), skipping Sentry upload"
            exit 0
          fi
          SENTRY_RELEASE="org.decentraland.godotexplorer@${SENTRY_RELEASE}"
          echo "Sentry release: $SENTRY_RELEASE"

          # Pinned through SENTRY_CLI_VERSION (the install script honors it).
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli --version

          upload_dif() {  # <label> <path> [extra sentry-cli flags]
            local label="$1" path="$2"
            shift 2
            if [ -e "$path" ]; then
              ls -lh "$path"
              sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --wait "$@" "$path"
              echo "✅ $label uploaded"
            else
              echo "⚠️  $label not found at $path"
            fi
          }

          # 1. Our Rust library; the sources bundle next to it (built in the build job) makes
          #    Sentry show the Rust code inline.
          upload_dif "libdclgodot.so" "handoff/symbols/libdclgodot.so"
          upload_dif "libdclgodot.so sources" "handoff/symbols/libdclgodot.so.src.zip"

          # 2. The engine library from the AAR.
          upload_dif "libgodot_android.so" "handoff/symbols/libgodot_android.so"

          # 3. sentry-godot's own native lib, so a crash inside the SDK is readable too. Its
          #    debug files are a separate asset of the pinned release (src/consts.rs); the
          #    server already has them after the first build of a given SDK version.
          SENTRY_ADDON_URL=$(grep -o 'https://github.com/getsentry/sentry-godot/releases/download/[^"]*' built-commit/src/consts.rs | head -1)
          SENTRY_ADDON_SYMBOLS_URL="${SENTRY_ADDON_URL/sentry-godot-/sentry-godot-debug-symbols-}"
          if curl -sfL -o /tmp/sentry-godot-symbols.zip "$SENTRY_ADDON_SYMBOLS_URL"; then
            rm -rf /tmp/sentry-godot-symbols && mkdir -p /tmp/sentry-godot-symbols
            unzip -o -q /tmp/sentry-godot-symbols.zip "addons/sentry/bin/android/*" -d /tmp/sentry-godot-symbols
            upload_dif "sentry-godot android symbols" "/tmp/sentry-godot-symbols/addons/sentry/bin/android"
          else
            echo "⚠️  could not download $SENTRY_ADDON_SYMBOLS_URL"
          fi

          # 4. Register the release under the runtime's name, attach commits and mark it
          #    deployed to the environment this build targets, so issues get "first seen in",
          #    suspect commits and regression detection.
          case "$PROD_FLAG_REF" in
            release*) SENTRY_ENV=production ;;
            *) SENTRY_ENV=staging ;;
          esac
          sentry-cli releases new "$SENTRY_RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          ( cd built-commit && \
            sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --auto --ignore-missing \
            || sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --local --ignore-missing \
            || echo "⚠️  could not associate commits with $SENTRY_RELEASE" )
          sentry-cli releases finalize "$SENTRY_RELEASE" --org "$SENTRY_ORG"
          sentry-cli releases deploys "$SENTRY_RELEASE" new --org "$SENTRY_ORG" -e "$SENTRY_ENV"
          echo "✅ Sentry release $SENTRY_RELEASE finalized ($SENTRY_ENV)"

      # Notify only — the step above is continue-on-error, so the job stays green.
      - name: Sentry symbol upload failed — notify (non-blocking)
        if: always() && steps.sentry_symbols.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Sentry symbol upload failed::Android native symbols for ${R2_SEGMENT} were not uploaded — crashes may be unsymbolicated. The APK/AAB themselves are unaffected."

  # PR CI only: the sticky Build Report. The APK is the throwaway-signed build attached to the
  # run; prod-signed APKs, Firebase and TestFlight come from the `build` label.
  report:
    name: Build Report
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Prepare Build Report
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            ANDROID_STATUS="✅ Success"
            APK_LINK="[📱 Download APK (CI-signed artifact)](${RUN_URL}#artifacts)"
          else
            ANDROID_STATUS="❌ Failed"
            APK_LINK="Build failed"
          fi
          # AAB and debug symbols are only built on main/release, never on PRs (this
          # report only runs on PRs), so don't link to artifacts that won't exist.
          AAB_LINK="_main/release builds only_"
          SYMBOLS_LINK="_main/release builds only_"

          {
            echo "## 📦 Build Report"
            echo ""
            echo "### 🤖 Android"
            echo ""
            echo "| Artifact | Status |"
            echo "|----------|--------|"
            echo "| APK | ${APK_LINK} |"
            echo "| AAB | ${AAB_LINK} |"
            echo "| Debug Symbols | ${SYMBOLS_LINK} |"
            echo ""
            echo "**Build Status**: ${ANDROID_STATUS}"
            echo ""
            echo "### 🍏 iOS"
            echo ""
            echo "> PR CI builds are signed with a throwaway CI key and attached to the run. Add the \`build\` label (alias: \`build-ios\`) for a distribution-signed APK on Firebase App Distribution, an iOS TestFlight build and the Slack notifications."
            echo ""
            echo "---"
            echo ""
            echo "🔗 **Workflow Run**: [View logs](${RUN_URL})"
            echo ""
            echo "🔄 **Updated**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > build-report.md

      # On fork PRs the GITHUB_TOKEN is read-only regardless of the declared
      # `pull-requests: write` permission, so posting the comment fails with "Resource not
      # accessible by integration". Let it fail soft: the comment just won't appear on fork
      # PRs, but the Android build itself must not be marked failed because of it.
      - name: Comment PR with Build Report
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-report
          path: build-report.md
