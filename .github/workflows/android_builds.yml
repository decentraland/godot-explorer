name: 🤖 Android
on:
  workflow_call:
    inputs:
      # All three are optional so the push path (runner.yml) keeps calling this with no `with:` block
      # and behaves exactly as before. mobile_distribute passes them to rebuild a specific commit
      # on demand (the superseded / self-sufficient case).
      ref:
        description: >
          Branch/ref to build (drives the prod flag + the R2 key branch segment). Empty → defaults
          to the triggering event's branch.
        required: false
        type: string
        default: ''
      sha:
        description: >
          Commit SHA to check out, allocate the build number for, and key the R2 upload by.
          Empty → defaults to the triggering event's head SHA.
        required: false
        type: string
        default: ''
      concurrency_key:
        description: >
          Overrides the concurrency-group discriminator so an on-demand rebuild (mobile_distribute)
          does not share a group with — and cancel — the push-triggered Android build for the same
          actor/ref. Empty keeps the default push behavior.
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      APK_ANDROID_KEYSTORE_BASE64:
        required: true
      APK_ANDROID_KEYSTORE_PASSWORD:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_ORG:
        required: true
      SENTRY_PROJECT:
        required: true
      # R2 mobile-artifacts bucket where the signed APK is published for download.
      # Optional: when unset the APK upload step is skipped (e.g. fork PRs).
      MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID:
        required: false
      MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY:
        required: false
      MOBILE_ARTIFACTS_R2_ENDPOINT:
        required: false
      MOBILE_ARTIFACTS_R2_BUCKET:
        required: false
      # API key (bearer) for the Cloudflare Worker build-number allocator. Optional: when unset
      # (e.g. fork PRs) the build keeps the committed placeholder versionCode (never shipped).
      BUILD_NUMBER_SECRET:
        required: false

permissions:
  pull-requests: write
  contents: read

concurrency:
  # `inputs.concurrency_key` (set by mobile_distribute's on-demand rebuild) isolates that run from
  # the push-triggered build so the two don't cancel each other; falls back to the original key.
  group: ci-${{ github.actor }}-${{ inputs.concurrency_key || github.head_ref || github.run_number }}-${{ github.ref }}-android
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 35
    container:
      # image generated at: https://github.com/decentraland/godot-docker-builder
      image: quay.io/decentraland/dcl-godot-android-builder:62ef6ebf357897ac382d7a52ac80de20883d9e15
      volumes:
        - /home/user/.cache/devgodot:/github/home/.cache/devgodot
      # WarpBuild's cache action authenticates via this token, which exists on the runner
      # host but is NOT propagated into the container unless forwarded explicitly. Without
      # it the cache step is a silent no-op ("Authentication token is invalid"). See:
      # https://github.com/WarpBuilds/cache#running-inside-a-container
      env:
        WARPBUILD_RUNNER_VERIFICATION_TOKEN: ${{ env.WARPBUILD_RUNNER_VERIFICATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: Add safe directory
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      # Cache the Rust build (host + Android target) so the dep tree isn't recompiled from
      # scratch every push. Use the WarpBuild-native cache (raw target/, NO cleaning): the v8
      # crate's prebuilt static lib (librusty_v8.a) lives under target/.../build/v8-*/out, and
      # rust-cache's cleanup strips it while keeping v8's fingerprint → warm builds then fail to
      # link. set-up-warp-cache keeps the full target/, so the lib survives (matches the iOS leg).
      # Restore runs on every branch; the save (below) only writes on main, so PRs restore from
      # main's cache without paying the multi-minute save on each push.
      # WarpBuild's cache action shells out to wget; the builder image may not ship it.
      - name: Ensure wget (WarpCache dependency)
        run: command -v wget >/dev/null 2>&1 || (apt-get update && apt-get install -y wget)
      - name: Set up build cache
        id: cache
        uses: ./.github/actions/set-up-warp-cache
        with:
          cache-name: android-build

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android
      - name: Cargo install
        run: cargo run -- install --targets android linux

      # Pass the real branch so release* PRs / on-demand rebuilds bake --prod: `inputs.ref` when
      # mobile_distribute rebuilds a specific commit, `head_ref` on PR events (where github.ref is
      # refs/pull/N/merge and would always map to --staging). Both empty on plain pushes → the
      # action falls back to github.ref, unchanged behavior.
      - name: Set prod flag
        uses: ./.github/actions/set-prod-flag
        with:
          ref: ${{ inputs.ref || github.head_ref }}

      # Allocate the store build number (Cloudflare Worker, idempotent per commit SHA). MUST run
      # BEFORE the lib build so build.rs bakes it into the version string (GODOT_EXPLORER_VERSION),
      # and so the APK + AAB exports below stamp the same versionCode for this commit.
      - name: Compute build number
        uses: ./.github/actions/compute-build-number
        with:
          sha: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          secret: ${{ secrets.BUILD_NUMBER_SECRET }}
          allocated-by: android

      - name: Build Rust libraries
        run: |
          cargo run -- build --release ${{ env.PROD_FLAG }}
          cargo run -- build --release --target android ${{ env.PROD_FLAG }}
          cargo run -- import-assets

      # Persist the freshly built target/ — no-op off main (see save-warp-cache). Placed right
      # after the build so a later export/sign failure can't lose a valid cache.
      - name: Save build cache (main only)
        uses: ./.github/actions/save-warp-cache
        with:
          cargo-key: ${{ steps.cache.outputs.cargo-key }}
          rust-key: ${{ steps.cache.outputs.rust-key }}

      - name: Export Android APK
        run: |
          cargo run -- export --target android --format apk --release
          mkdir -p android-debug-symbols
          cp godot/android/build/build/outputs/native-debug-symbols/standardRelease/native-debug-symbols.zip android-debug-symbols/ || true

      # Re-sign the exported APK with the production distribution key so every published
      # build shares one stable signing identity (Android requires the same key across
      # upgrades). The export step above already signs the APK with an auto-generated
      # keystore, so this is a re-sign — not the APK's only signature.
      #
      # Fork PRs don't receive repo secrets, so the keystore is unavailable there. In that
      # case skip the re-sign and keep the export-signed APK — a valid, installable build
      # for testing. Mirrors the graceful degradation of the R2-upload / build-number steps
      # (an empty secret used to decode to a 0-byte keystore and hard-fail apksigner).
      - name: Sign Android APK
        env:
          APK_ANDROID_KEYSTORE_BASE64: ${{ secrets.APK_ANDROID_KEYSTORE_BASE64 }}
          APK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$APK_ANDROID_KEYSTORE_BASE64" ]; then
            echo "⚠️  APK signing keystore unavailable (fork PR — repo secrets are not exposed to forks)."
            echo "    Keeping the APK as signed by the Godot export step; production re-signing runs"
            echo "    only on same-repo branches (main/release and internal PRs)."
            exit 0
          fi

          # Decode the production release keystore from the secret.
          echo "$APK_ANDROID_KEYSTORE_BASE64" | base64 -d > apk-release.keystore
          ls -la apk-release.keystore

          # Find Android build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          # Align the APK first (required for apksigner)
          ${BUILD_TOOLS_DIR}zipalign -v -p 4 exports/decentraland.godot.client.apk exports/decentraland.godot.client-aligned.apk

          # Sign the APK
          ${BUILD_TOOLS_DIR}apksigner sign --ks apk-release.keystore \
            --ks-pass pass:"$APK_ANDROID_KEYSTORE_PASSWORD" \
            --out exports/decentraland.godot.client-signed.apk \
            exports/decentraland.godot.client-aligned.apk

          # Verify the signature
          ${BUILD_TOOLS_DIR}apksigner verify --verbose exports/decentraland.godot.client-signed.apk

          # Replace unsigned with signed
          mv exports/decentraland.godot.client-signed.apk exports/decentraland.godot.client.apk
          rm exports/decentraland.godot.client-aligned.apk

      # The AAB is the Play Store artifact — only build/sign/upload it on main/release*.
      # env.BRANCH_NAME (set-prod-flag) resolves inputs.ref → PR head branch → push branch,
      # so these gates work on versioned release branches and on-demand rebuilds alike.
      - name: Export Android AAB
        if: success() && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        run: |
          cargo run -- export --target android --format aab --release

      # Play Console symbolicates native crashes from the symbols AGP embeds in the bundle
      # (debugSymbolLevel FULL in the engine's gradle template). Warn, don't fail, if they are
      # missing: the bundle still ships, but the store's crash view would be unreadable.
      - name: Check AAB carries native debug symbols
        if: success() && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        shell: bash
        run: |
          AAB=$(ls exports/*.aab | head -1)
          if unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols"; then
            echo "✅ $AAB includes native debug symbols"
          else
            echo "::warning title=AAB without native debug symbols::$AAB has no BUNDLE-METADATA/com.android.tools.build.debugsymbols entry - Play Console crash stacks will be unreadable."
          fi

      # Decode and setup keystore for AAB signing
      - name: Setup AAB Signing Keystore
        if: success() && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > dclgodot.upload.jks
          ls -la dclgodot.upload.jks

      # Sign the AAB file
      - name: Sign Android AAB
        if: success() && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore dclgodot.upload.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -signedjar exports/decentraland.godot.client-signed.aab \
            exports/decentraland.godot.client.aab \
            upload

          # Verify the signature
          jarsigner -verify -verbose exports/decentraland.godot.client-signed.aab

          # Replace unsigned with signed
          mv exports/decentraland.godot.client-signed.aab exports/decentraland.godot.client.aab

      # Copy Android Artifacts
      - name: Copy Android Artifacts
        if: success() || failure()
        run: |
          pwd
          ls -la
          ls -la exports/
          mkdir -p android-artifacts-apk
          mkdir -p android-artifacts-aab
          mv exports/decentraland.godot.client.apk android-artifacts-apk/ || true
          mv exports/decentraland.godot.client.aab android-artifacts-aab/ || true

      # Upload the signed artifacts to the R2 mobile-artifacts bucket so they can be
      # downloaded directly (the PR build report and the Mobile Distribute Slack
      # notification link here). Keyed by branch + commit SHA so a download can target
      # an exact build. The APK is uploaded for every build; the AAB (Play Store
      # artifact) only for main/release.
      - name: Upload Android artifacts to R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
          AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
          # Public R2 domain mapped to the mobile-artifacts bucket root.
          R2_PUBLIC_BASE_URL: "https://mobile-artifacts.dclregenesislabs.xyz"
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_S3_BUCKET" ] || [ -z "$AWS_ENDPOINT_URL" ]; then
            echo "⚠️  R2 mobile-artifacts bucket not configured (MOBILE_ARTIFACTS_R2_* secrets), skipping APK upload"
            exit 0
          fi

          APK_PATH="android-artifacts-apk/decentraland.godot.client.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "⚠️  APK not found at $APK_PATH, skipping R2 upload"
            exit 0
          fi

          # The android builder image does not ship the AWS CLI; install v2 on demand.
          if ! command -v aws >/dev/null 2>&1; then
            echo "Installing AWS CLI v2..."
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install -i /tmp/aws-cli -b /tmp/aws-bin
            export PATH="/tmp/aws-bin:$PATH"
          fi

          SHA="${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}"
          BRANCH="${{ inputs.ref || github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          LATEST_KEY="android/${SAFE_BRANCH}/latest/decentraland.godot.client.apk"

          echo "📤 Uploading APK to s3://${AWS_S3_BUCKET}/${KEY}"
          aws s3 cp "$APK_PATH" "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          # Update the branch 'latest' pointer WITHOUT re-uploading. The managed `aws s3 cp s3:// s3://`
          # is unusable on R2 (tagging headers NotImplemented), so use low-level copy-object; fall
          # back to a plain re-upload if R2 rejects the copy.
          aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_KEY" \
            --copy-source "${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
            || aws s3 cp "$APK_PATH" "s3://${AWS_S3_BUCKET}/${LATEST_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"

          PUBLIC_URL="${R2_PUBLIC_BASE_URL}/${KEY}"
          echo "✅ APK uploaded to R2 (sha=${SHA}, branch=${SAFE_BRANCH})"
          echo "🔗 Public URL: ${PUBLIC_URL}"
          # Surface the direct download link to later steps (build report comment).
          echo "APK_PUBLIC_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"

          # Sidecar: record the build number this APK was BAKED with, right next to it. The deploy
          # orchestrator (mobile_distribute android-resolve) compares it against the authoritative
          # allocation before reusing this APK — if the allocator has since bumped the number
          # (a store shipped past it), the APK is stale and must be rebuilt, not reused. Mirrors the
          # iOS sidecar in ios_r2_artifact.yml.
          if [ -n "${DCL_BUILD_NUMBER:-}" ]; then
            BUILD_NUMBER_KEY="android/${SAFE_BRANCH}/${SHA}/build_number.txt"
            LATEST_BUILD_NUMBER_KEY="android/${SAFE_BRANCH}/latest/build_number.txt"
            printf '%s' "$DCL_BUILD_NUMBER" > build_number.txt
            echo "🔢 Writing build_number sidecar ($DCL_BUILD_NUMBER) → s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}"
            aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
            aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$LATEST_BUILD_NUMBER_KEY" \
              --copy-source "${AWS_S3_BUCKET}/${BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
              || aws s3 cp build_number.txt "s3://${AWS_S3_BUCKET}/${LATEST_BUILD_NUMBER_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
          else
            echo "ℹ️  DCL_BUILD_NUMBER unset — no build_number sidecar (fork PR / allocator skipped)."
          fi

          # The AAB is the Play Store artifact — only publish it for main/release*.
          case "$BRANCH" in main|release*) PUBLISH_AAB=true;; *) PUBLISH_AAB=false;; esac
          if [ "$PUBLISH_AAB" = "true" ]; then
            AAB_PATH="android-artifacts-aab/decentraland.godot.client.aab"
            if [ -f "$AAB_PATH" ]; then
              AAB_KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.aab"
              AAB_LATEST_KEY="android/${SAFE_BRANCH}/latest/decentraland.godot.client.aab"
              echo "📤 Uploading AAB to s3://${AWS_S3_BUCKET}/${AAB_KEY}"
              aws s3 cp "$AAB_PATH" "s3://${AWS_S3_BUCKET}/${AAB_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
              # Update the branch 'latest' pointer WITHOUT re-uploading (low-level copy-object;
              # R2 rejects the managed server-side copy). Fall back to a re-upload on failure.
              aws s3api copy-object --bucket "$AWS_S3_BUCKET" --key "$AAB_LATEST_KEY" \
                --copy-source "${AWS_S3_BUCKET}/${AAB_KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null \
                || aws s3 cp "$AAB_PATH" "s3://${AWS_S3_BUCKET}/${AAB_LATEST_KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
              echo "✅ AAB uploaded to R2"
              echo "🔗 Public URL: ${R2_PUBLIC_BASE_URL}/${AAB_KEY}"
            else
              echo "⚠️  AAB not found at $AAB_PATH, skipping AAB upload"
            fi
          else
            echo "ℹ️  Branch '$BRANCH' is not main/release* — skipping AAB upload (APK only)"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: AndroidAPK
          path: android-artifacts-apk/
          if-no-files-found: error

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        with:
          name: AndroidAAB
          path: android-artifacts-aab/
          if-no-files-found: error

      - name: Upload Android Debug Symbols
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        with:
          name: Android Native Debug Symbols
          path: android-debug-symbols/
          if-no-files-found: error
        
      # Upload debug symbols to Sentry and register the release, for production builds
      # (main/release* only). Only the libraries that actually ship: our Rust lib and the engine
      # lib straight from the AAR Godot's gradle template packages (unstripped there, same build-id
      # as the stripped copy inside the APK/AAB). The release must be exactly the string the
      # runtime reports (`{version}+{build}`, lib/build.rs) or Sentry sees two different releases.
      # continue-on-error: the APK/AAB are already built and uploaded by this point, so a
      # Sentry hiccup (e.g. server-side "Reported checksum mismatch") must never fail the
      # build — it only costs us symbolication. We notify instead.
      - name: Upload debug symbols to Sentry
        id: sentry_symbols
        if: success() && (env.BRANCH_NAME == 'main' || startsWith(env.BRANCH_NAME, 'release'))
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_CLI_VERSION: "3.7.0"
        run: |
          set -euo pipefail
          EXPLORER_VERSION=$(cargo run -- explorer-version)
          echo "Explorer version: $EXPLORER_VERSION"
          if [[ "$EXPLORER_VERSION" =~ -dev$ ]]; then
            echo "Development build detected (-dev suffix found), skipping Sentry upload"
            exit 0
          fi
          SENTRY_RELEASE="org.decentraland.godotexplorer@$(cargo run -- explorer-version --sentry-release)"
          echo "Sentry release: $SENTRY_RELEASE"

          # Pinned through SENTRY_CLI_VERSION (the install script honors it).
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli --version

          upload_dif() {  # <label> <path> [extra sentry-cli flags]
            local label="$1" path="$2"
            shift 2
            if [ -e "$path" ]; then
              ls -lh "$path"
              sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --wait "$@" "$path"
              echo "✅ $label uploaded"
            else
              echo "⚠️  $label not found at $path"
            fi
          }

          # 1. Our Rust library, with sources so Sentry shows the Rust code inline.
          upload_dif "libdclgodot.so" "lib/target/libdclgodot_android/libdclgodot.so" --include-sources

          # 2. The engine library from the AAR. (build/outputs/native-debug-symbols is not
          #    usable: Godot's export runs `gradle clean` first, so the zip is gone by now.)
          GODOT_AAR="godot/android/build/libs/release/godot-lib.template_release.aar"
          if [ -f "$GODOT_AAR" ]; then
            rm -rf /tmp/godot-aar && mkdir -p /tmp/godot-aar
            unzip -o -q "$GODOT_AAR" "jni/arm64-v8a/libgodot_android.so" -d /tmp/godot-aar
            upload_dif "libgodot_android.so" "/tmp/godot-aar/jni/arm64-v8a/libgodot_android.so"
          else
            echo "⚠️  Godot AAR not found at $GODOT_AAR"
          fi

          # 3. sentry-godot's own native lib, so a crash inside the SDK is readable too. Its
          #    debug files are a separate asset of the pinned release (src/consts.rs); the
          #    server already has them after the first build of a given SDK version.
          SENTRY_ADDON_URL=$(grep -o 'https://github.com/getsentry/sentry-godot/releases/download/[^"]*' src/consts.rs | head -1)
          SENTRY_ADDON_SYMBOLS_URL="${SENTRY_ADDON_URL/sentry-godot-/sentry-godot-debug-symbols-}"
          if curl -sfL -o /tmp/sentry-godot-symbols.zip "$SENTRY_ADDON_SYMBOLS_URL"; then
            rm -rf /tmp/sentry-godot-symbols && mkdir -p /tmp/sentry-godot-symbols
            unzip -o -q /tmp/sentry-godot-symbols.zip "addons/sentry/bin/android/*" -d /tmp/sentry-godot-symbols
            upload_dif "sentry-godot android symbols" "/tmp/sentry-godot-symbols/addons/sentry/bin/android"
          else
            echo "⚠️  could not download $SENTRY_ADDON_SYMBOLS_URL"
          fi

          # 4. Register the release under the runtime's name, attach commits and mark it
          #    deployed to the environment this build targets, so issues get "first seen in",
          #    suspect commits and regression detection.
          case "${PROD_FLAG:-}" in
            --prod) SENTRY_ENV=production ;;
            *) SENTRY_ENV=staging ;;
          esac
          sentry-cli releases new "$SENTRY_RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --auto --ignore-missing \
            || sentry-cli releases set-commits "$SENTRY_RELEASE" --org "$SENTRY_ORG" --local --ignore-missing \
            || echo "⚠️  could not associate commits with $SENTRY_RELEASE"
          sentry-cli releases finalize "$SENTRY_RELEASE" --org "$SENTRY_ORG"
          sentry-cli releases deploys "$SENTRY_RELEASE" new --org "$SENTRY_ORG" -e "$SENTRY_ENV"
          echo "✅ Sentry release $SENTRY_RELEASE finalized ($SENTRY_ENV)"

      # Notify only — the step above is continue-on-error, so the job stays green.
      - name: Sentry symbol upload failed — notify (non-blocking)
        if: always() && steps.sentry_symbols.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Sentry symbol upload failed::Android native symbols for ${{ github.ref_name }} were not uploaded — crashes may be unsymbolicated. The APK/AAB themselves are unaffected."

      # Build Report Comment
      - name: Prepare Build Report
        if: github.event_name == 'pull_request' && always()
        run: |
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine build status
          if [ "${{ job.status }}" = "success" ]; then
            ANDROID_STATUS="✅ Success"
            # Prefer the direct R2 download link when the APK was uploaded.
            if [ -n "${APK_PUBLIC_URL:-}" ]; then
              APK_LINK="[📱 Download APK](${APK_PUBLIC_URL})"
            else
              APK_LINK="[📱 Download APK](${ARTIFACTS_URL}/artifacts)"
            fi
          else
            ANDROID_STATUS="❌ Failed"
            APK_LINK="Build failed"
          fi
          # AAB and debug symbols are only built on main/release, never on PRs (this
          # report only runs on PRs), so don't link to artifacts that won't exist.
          AAB_LINK="_main/release builds only_"
          SYMBOLS_LINK="_main/release builds only_"

          {
            echo "## 📦 Build Report"
            echo ""
            echo "### 🤖 Android"
            echo ""
            echo "| Artifact | Status |"
            echo "|----------|--------|"
            echo "| APK | ${APK_LINK} |"
            echo "| AAB | ${AAB_LINK} |"
            echo "| Debug Symbols | ${SYMBOLS_LINK} |"
            echo ""
            echo "**Build Status**: ${ANDROID_STATUS}"
            echo ""
            echo "### 🍏 iOS"
            echo ""
            echo "> The signed APK is uploaded to R2 on every build (link above). Add the \`build\` label (alias: \`build-ios\`) to build & ship iOS to TestFlight and post a Slack \"Android build ready\" notification."
            echo ""
            echo "---"
            echo ""
            echo "🔗 **Workflow Run**: [View logs](${ARTIFACTS_URL})"
            echo ""
            echo "🔄 **Updated**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > build-report.md

      # On fork PRs the GITHUB_TOKEN is read-only regardless of the declared
      # `pull-requests: write` permission, so posting the comment fails with "Resource not
      # accessible by integration". Let it fail soft: the comment just won't appear on fork
      # PRs, but the Android build itself must not be marked failed because of it.
      - name: Comment PR with Build Report
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-report
          path: build-report.md