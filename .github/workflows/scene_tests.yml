name: 🧪 Scene tests
on:
  workflow_call:
    inputs:
      sha:
        description: Commit to test; its Linux library comes from the caller's linux-lib job.
        required: true
        type: string

jobs:
  # The scene tests exercise the Godot side only: a PR that changes nothing there (the React Native
  # app, docs, unrelated CI) skips them. Pushes always run them.
  changes:
    name: Godot-side changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      godot: ${{ steps.files.outputs.godot }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "godot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          godot_side='^(lib/|godot/|src/|tests/scene-tests/|scripts/ci/scene-tests\.sh|scripts/serve-scene-tests\.sh|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/(scene_tests|android_builds)\.yml$)'
          if printf '%s\n' "$files" | grep -qE "$godot_side"; then
            echo "godot=true" >> "$GITHUB_OUTPUT"
          else
            echo "godot=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scene tests skipped::This PR changes nothing on the Godot side."
          fi

  ecs:
    name: Scene tests (ECS)
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      # Only the xtask is compiled here (Godot install and asset import); the library is downloaded.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.94"
      - name: Set up cache
        uses: ./.github/actions/set-up-cache
      # The library links the same system libraries it was built against.
      - name: Install dependencies
        uses: ./.github/actions/install-deps
      - name: Install Godot
        run: cargo run -- install

      - name: Download Linux library
        uses: actions/download-artifact@v4
        with:
          name: libdclgodot-linux-release
          path: lib/target/libdclgodot_linux

      - name: Import assets
        uses: ./.github/actions/import-assets
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/scene-tests/package-lock.json

      - name: Run the ECS tier
        run: scripts/ci/scene-tests.sh --tier ecs

      - name: Upload the Godot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-tests-log
          path: tests/scene-tests/scene-tests.log
          retention-days: 7
          if-no-files-found: ignore
