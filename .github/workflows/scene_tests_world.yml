name: 🧪 Scene tests QA World
# Deploys the scene tests to the QA World (repository variable SCENE_TESTS_WORLD): every scene on
# pushes to main, and a PR's changed scenes into its own zone while it carries the qa-scene label;
# the zone is cleared when the PR closes or the label comes off. Signs with the
# SCENE_TESTS_DEPLOYER_KEY secret (a wallet on the World's deployment list). Without the variable or
# the secret the jobs fail.
on:
  push:
    branches: [main]
    paths:
      - 'tests/scene-tests/**'
      - 'scripts/ci/deploy-scene-tests.mjs'
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: scene-tests-world-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCENE_TESTS_WORLD: ${{ vars.SCENE_TESTS_WORLD }}

jobs:
  deploy:
    name: Deploy to the QA World
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed'
          && github.event.action != 'unlabeled'
          && contains(github.event.pull_request.labels.*.name, 'qa-scene')
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the World and deployer key
        env:
          DCL_PRIVATE_KEY: ${{ secrets.SCENE_TESTS_DEPLOYER_KEY }}
        run: |
          if [ -z "$SCENE_TESTS_WORLD" ] || [ -z "$DCL_PRIVATE_KEY" ]; then
            echo "::error title=QA World not configured::Set the SCENE_TESTS_WORLD variable and the SCENE_TESTS_DEPLOYER_KEY secret."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # the PR's changed scenes come from a diff against its base
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/scene-tests/package-lock.json
      - name: Install the scene tests
        working-directory: tests/scene-tests
        run: npm ci --no-audit --no-fund
      - name: Deploy
        id: deploy
        env:
          DCL_PRIVATE_KEY: ${{ secrets.SCENE_TESTS_DEPLOYER_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node scripts/ci/deploy-scene-tests.mjs deploy --zone "$PR_NUMBER" --base "origin/$BASE_REF"
          else
            node scripts/ci/deploy-scene-tests.mjs deploy
          fi

      # The PR's "View deployment". Not a job `environment`: every PR shares qa-world, and a
      # job environment marks the other PRs' deployments inactive.
      - name: Record the deployment
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          URL: ${{ steps.deploy.outputs.url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for old in $(gh api "repos/$REPO/deployments?environment=qa-world&ref=$REF" --jq '.[].id'); do
            gh api -X POST "repos/$REPO/deployments/$old/statuses" -f state=inactive >/dev/null
          done
          id=$(jq -n --arg ref "$REF" '{ref: $ref, environment: "qa-world", auto_merge: false,
                required_contexts: [], transient_environment: true, production_environment: false}' \
            | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          jq -n --arg url "$URL" --arg log "$LOG_URL" \
            '{state: "success", environment_url: $url, log_url: $log, auto_inactive: false}' \
            | gh api -X POST "repos/$REPO/deployments/$id/statuses" --input - >/dev/null

  undeploy:
    name: Clear the PR's QA zone
    if: >-
      github.event_name == 'pull_request'
      && ((github.event.action == 'closed'
           && contains(github.event.pull_request.labels.*.name, 'qa-scene'))
          || (github.event.action == 'unlabeled' && github.event.label.name == 'qa-scene'))
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the World and deployer key
        env:
          DCL_PRIVATE_KEY: ${{ secrets.SCENE_TESTS_DEPLOYER_KEY }}
        run: |
          if [ -z "$SCENE_TESTS_WORLD" ] || [ -z "$DCL_PRIVATE_KEY" ]; then
            echo "::error title=QA World not configured::Set the SCENE_TESTS_WORLD variable and the SCENE_TESTS_DEPLOYER_KEY secret."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/scene-tests/package-lock.json
      - name: Install the scene tests
        working-directory: tests/scene-tests
        run: npm ci --no-audit --no-fund
      - name: Undeploy
        env:
          DCL_PRIVATE_KEY: ${{ secrets.SCENE_TESTS_DEPLOYER_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/deploy-scene-tests.mjs undeploy --zone "$PR_NUMBER"
      - name: Mark the PR's deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          for old in $(gh api "repos/$REPO/deployments?environment=qa-world&ref=$REF" --jq '.[].id'); do
            gh api -X POST "repos/$REPO/deployments/$old/statuses" -f state=inactive >/dev/null
          done
