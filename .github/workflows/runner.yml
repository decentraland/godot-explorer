name: 🔗 GHA
on:
  push:
    branches:
      - main
      - release
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-runner
  cancel-in-progress: true

jobs:
  # First stage: Fast formatting checks only
  static-checks:
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Clippy and build checks that require compilation
  clippy:
    name: 🔧 Clippy & Build Checks
    needs: static-checks
    uses: ./.github/workflows/clippy.yml

  # Third stage: Run all the builds and tests (all depend on static-checks)

  # Temporarily disabled: GPU self-hosted runner is down
  # test-coverage:
  #   name: 🔎 Test & Coverage
  #   needs: static-checks
  #   uses: ./.github/workflows/coverage.yml

  # The build job inside holds no secrets. Signing, R2 and Sentry run in its environment-bound
  # sign-publish job, which only exists on pushes (`mobile-release` admits main / release* only;
  # a pull_request ref can never deploy to it). `secrets: inherit` is what lets that job read the
  # environment's secrets; nothing sensitive lives at repository level.
  android-build:
    name: 🤖 Android
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      r2_segment: ${{ github.event_name == 'push' && github.ref_name || '' }}
      publish_aab: ${{ github.event_name == 'push' }}
    secrets: inherit

  # PR CI attaches a throwaway-signed APK to the run. Distribution-signed APKs (R2 + Firebase)
  # and iOS TestFlight builds come from mobile_distribute.yml:
  # - Label 'build' (alias 'build-ios') on PRs
  # - Manual workflow dispatch (ref: main/release)
  # Pushes to main/release publish the signed APK (+ AAB) to R2 from android_builds.yml.

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml
  # Disable Windows and MacOS builds for now
  # macos-build:
  #   name: 🍎 macOS
  #   needs: static-checks
  #   uses: ./.github/workflows/macos_builds.yml

  # windows-build:
  #   name: 🏁 Windows
  #   needs: static-checks
  #   uses: ./.github/workflows/windows_builds.yml

  # # Third stage: Extras
  docker-build-test:
    name: 🐳 Docker builds and test
    needs: linux-build
    uses: ./.github/workflows/docker_build_test.yml
    permissions:
      contents: read
    with:
      publish_docker: ${{ contains(github.event.pull_request.labels.*.name, 'publish-docker') }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

  # Temporarily disabled: GPU self-hosted runner is down
  # benchmark:
  #   name: 📊 Benchmark Report
  #   needs: static-checks
  #   uses: ./.github/workflows/benchmark.yml
  #   secrets:
  #     BENCHMARK_AWS_ACCESS_KEY_ID: ${{ secrets.BENCHMARK_AWS_ACCESS_KEY_ID }}
  #     BENCHMARK_AWS_SECRET_ACCESS_KEY: ${{ secrets.BENCHMARK_AWS_SECRET_ACCESS_KEY }}
  #     BENCHMARK_AWS_ENDPOINT_URL: ${{ secrets.BENCHMARK_AWS_ENDPOINT_URL }}
  #     BENCHMARK_AWS_S3_BUCKET: ${{ secrets.BENCHMARK_AWS_S3_BUCKET }}
