name: 📸 RN visual snapshots

# Screenshots of every screen in the RN gallery (Storybook stories generated from rn/src/gallery), taken by Maestro
# on an Android emulator running the no-Godot debug app. A PR's capture is compared by reg-cli with the official
# screenshots of its base branch and sent to the mobile board (R2), where the changes are reviewed: the review is
# mirrored to the PR as the commit status "RN visual snapshots". A push to an official branch replaces its set.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rn/**'
      - 'tools/ui-spec/**'
      - '.github/workflows/rn_visual.yml'
      - '.github/actions/rn-npm-ci/**'
  push:
    branches: [2.x, main, release, 'release-*']
    paths:
      - 'rn/**'
      - 'tools/ui-spec/**'
      - '.github/workflows/rn_visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rn-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK (no Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/rn-npm-ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('rn/android/**/*.gradle*', 'rn/android/gradle/wrapper/gradle-wrapper.properties', 'rn/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      # DCL_NO_GODOT drops the dcl-core native module from autolinking (the mock core runs instead);
      # x86_64 because the hosted emulator is x86_64.
      - name: Build the debug APK
        working-directory: rn/android
        env:
          DCL_NO_GODOT: '1'
        run: ./gradlew :app:assembleDebug -PdclNoGodot=true -PdclAbi=x86_64 -PreactNativeArchitectures=x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: rn-debug-apk
          path: rn/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

  capture:
    name: Capture ${{ matrix.shard }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: discover, sources: discover }
          - { shard: backpack, sources: backpack }
          - { shard: profile-hud, sources: 'profile,hud,loading' }
          - { shard: menu, sources: menu }
          - { shard: settings, sources: 'settings-portrait,settings-revamp' }
          - { shard: extra, sources: extra }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/rn-npm-ci

      - uses: actions/download-artifact@v4
        with:
          name: rn-debug-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Python imaging for the capture post-processing
        run: sudo apt-get install -y --no-install-recommends python3-pil

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture the previews on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          DCL_APK: ${{ github.workspace }}/apk/app-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ui-spec/ci_capture.sh "${{ matrix.sources }}" shots/${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.shard }}
          path: shots/${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metro-log-${{ matrix.shard }}
          path: metro.log
          if-no-files-found: ignore
          retention-days: 3

  compare:
    name: Compare with the official screenshots
    needs: capture
    if: ${{ !cancelled() && needs.capture.result != 'skipped' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BUILD_REPORTER_TOKEN: ${{ secrets.BUILD_REPORTER_TOKEN }}
      BOARD_EVENTS_URL: ${{ vars.BOARD_EVENTS_URL }}
      BOARD_URL: https://mobile-board.dclregenesislabs.xyz
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/rn-npm-ci

      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots

      # The board's official set of the base branch. Until the first push to a base branch has published one,
      # the screenshots in git (rn/visual-baselines) stand in.
      - name: Official screenshots of the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p baseline
          if ! python3 tools/ui-spec/board_visual.py fetch-official --ref "$BASE_REF" --out baseline; then
            echo "No official screenshots for $BASE_REF: comparing with rn/visual-baselines."
            [ ! -d rn/visual-baselines ] || cp -R rn/visual-baselines/. baseline/
          fi

      # reg-cli exits 0 when screens changed: the review decides, not this step.
      - name: Compare
        run: |
          python3 tools/ui-spec/visual_report.py prepare --new shots --baseline baseline
          cd rn && npx reg-cli ../visual-report/actual ../visual-report/expected ../visual-report/diff \
            -R ../visual-report/index.html -J ../visual-report/reg.json -M 0.06 -T 0.001 -I

      - name: Send the report to the board
        id: board
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f visual-report/reg.json ] || exit 0
          RUN=$(python3 tools/ui-spec/board_visual.py open-run --kind pr --sha "$HEAD_SHA" --ref "$HEAD_REF" --base-ref "$BASE_REF" --pr "$PR" | tail -n 1)
          echo "$RUN" | grep -Eq '^[0-9]+-[0-9]+$' || exit 0
          python3 tools/ui-spec/board_visual.py upload-report --run "$RUN" --report visual-report
          python3 tools/ui-spec/board_visual.py complete-run --run "$RUN" --report visual-report
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOARD_RUN: ${{ steps.board.outputs.run }}
        run: |
          [ -f visual-report/reg.json ] || exit 0
          rc=0
          python3 tools/ui-spec/visual_report.py summary --run-url "$RUN_URL" \
            ${BOARD_RUN:+--board-url "$BOARD_URL/#visual=$BOARD_RUN"} || rc=$?
          cat visual-report/report.md >> "$GITHUB_STEP_SUMMARY"
          # A fork's token is read-only: the summary above is the report there.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            PR=${{ github.event.pull_request.number }}
            ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- rn-visual-snapshots -->")) | .id' | head -n 1)
            if [ -n "$ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@visual-report/report.md >/dev/null
            else
              gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@visual-report/report.md >/dev/null
            fi
          fi
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rn-visual-report
          path: visual-report
          if-no-files-found: ignore
          retention-days: 14

  # A push to an official branch (2.x, main, release*) replaces that branch's official screenshots in the board.
  official:
    name: Publish the official screenshots
    needs: capture
    if: ${{ needs.capture.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_REPORTER_TOKEN: ${{ secrets.BUILD_REPORTER_TOKEN }}
      BOARD_EVENTS_URL: ${{ vars.BOARD_EVENTS_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots

      - name: Publish
        run: python3 tools/ui-spec/board_visual.py publish-official --ref "${{ github.ref_name }}" --sha "${{ github.sha }}" --dir shots
