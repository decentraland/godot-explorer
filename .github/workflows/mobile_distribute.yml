name: 📱 Mobile Build & Distribute (iOS TestFlight + Android APK)

# Single entry point that builds & distributes BOTH mobile platforms with a mirrored, store-aware
# flow. prepare allocates ONE authoritative build number for the commit; each leg then resolves
# reuse-vs-rebuild against it (a shared guard) so iOS and Android can never diverge:
#   - iOS    → resolve (reuse the self-hosted R2 export if its baked number is current, else rebuild)
#              → sign & upload to TestFlight via the godot-asc-deploy repo
#   - Android → resolve (reuse the push-built R2 APK if its baked number is current, else rebuild it
#              here via android_builds.yml) → surface the R2 download link (Slack + PR comment)
#
# Triggered by:
#   - Every push to `release` (full distribution). Versioned release-* branches are NOT
#     push-triggered — distribute them via the `build` label on their PR (bakes --prod)
#     or a manual dispatch.
#   - A weekday (Mon–Fri) 09:00 UTC cron on `main` — only when main changed since the
#     last successful main distribution (no point re-shipping an identical commit)
#   - The `build` label on a PR (alias: `build-ios` for backward compatibility)
#   - Manual workflow dispatch on the main / release branch
#
# The Android leg rebuilds only when the push-built APK is missing or its baked number was
# superseded on a store; otherwise it reuses that APK and just surfaces the R2 download link. It
# does NOT push to a store. For main/release builds it additionally surfaces the AAB (Play Store
# artifact); a rebuild regenerates the AAB with the current number too.
on:
  push:
    branches:
      - release          # every release push → full distribution
  schedule:
    - cron: '0 9 * * 1-5'  # weekdays 09:00 UTC → main, only if changed since last build
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build & distribute (main or any release* branch)'
        required: true
        type: string
        default: 'main'
      whats_new:
        description: 'TestFlight "What to Test" notes (optional; auto-generated from the commit when empty)'
        required: false
        type: string
        default: ''

permissions:
  pull-requests: write
  contents: read
  actions: write
  id-token: write   # OIDC token for keyless Google Cloud auth (Firebase App Distribution via WIF)

jobs:
  prepare:
    name: Prepare distribution
    # Run for: push to release, the weekday main cron, a manual dispatch, or the
    # build / build-ios label on a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event.label.name == 'build' ||
      github.event.label.name == 'build-ios'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ctx.outputs.ref }}
      sha: ${{ steps.ctx.outputs.sha }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      safe_branch: ${{ steps.ctx.outputs.safe_branch }}
      # Defaults to 'true' for every event except the cron, where the change-detection
      # step below may set it to 'false' when main is unchanged since the last build.
      should_build: ${{ steps.changes.outputs.should_build || 'true' }}
      # Only the dynamic thread ts flows via outputs. The channel ID is a SECRET and GitHub
      # masks secrets out of job outputs (they arrive empty downstream), so every job reads
      # SLACK_CHANNEL straight from secrets.SLACK_CHANNEL_ID instead.
      slack_ts: ${{ steps.slack.outputs.ts }}
      triggered_by: ${{ steps.ctx.outputs.triggered_by }}
      pr_url: ${{ steps.ctx.outputs.pr_url }}
      commit_short: ${{ steps.ctx.outputs.commit_short }}
      # The ONE authoritative store build number for this commit + the full baked version string.
      # Both mobile legs bake/compare THIS number, so iOS and Android can never diverge. Empty on
      # fork PRs (no allocator secret) → downstream guards skip and nothing ships to a store.
      build_number: ${{ steps.buildnum.outputs.build_number }}
      build_version: ${{ steps.buildnum.outputs.build_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve build context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
            SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha')
            PR_NUMBER=""
            TRIGGERED_BY="manual by ${{ github.actor }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            REF="${{ github.ref_name }}"; SHA="${{ github.sha }}"; PR_NUMBER=""
            TRIGGERED_BY="daily trigger"
          elif [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref_name }}"; SHA="${{ github.sha }}"; PR_NUMBER=""
            TRIGGERED_BY="push to ${REF}"
          else
            REF="${{ github.event.pull_request.head.ref }}"
            SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TRIGGERED_BY="label by ${{ github.actor }}"
          fi
          SAFE_BRANCH=$(echo "$REF" | tr '/' '-')
          PR_URL=""
          [ -n "$PR_NUMBER" ] && PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          {
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "pr_number=$PR_NUMBER"
            echo "safe_branch=$SAFE_BRANCH"
            echo "triggered_by=$TRIGGERED_BY"
            echo "pr_url=$PR_URL"
            echo "commit_short=${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "Distributing ref=$REF sha=$SHA pr=$PR_NUMBER trigger=$TRIGGERED_BY"

      - name: Check main for changes since last successful distribution
        id: changes
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA="${{ github.sha }}"
          # Last *successful* mobile_distribute run on main (cron or dispatch-on-main).
          # PR-label runs live on the PR head branch and push-to-release on `release`,
          # so --branch main isolates the real main distributions.
          LAST_SHA=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow mobile_distribute.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  main unchanged since last distribution ($LAST_SHA) — skipping."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "🆕 main changed (last=${LAST_SHA:-none} current=$CURRENT_SHA) — building."
          fi

      # Allocate the authoritative store build number for this commit ONCE (idempotent per SHA), up
      # front, so both mobile legs bake/compare the SAME number and can never diverge. The build jobs
      # (ios_r2_artifact / android_builds) still run compute-build-number themselves — needed so
      # build.rs sees DCL_BUILD_NUMBER at build time — but it's idempotent and returns this same
      # number. Gated to skip on the cron no-op; empty on fork PRs (no secret) → guards skip.
      - name: Allocate build number
        id: compute
        if: steps.changes.outputs.should_build != 'false'
        uses: ./.github/actions/compute-build-number
        with:
          sha: ${{ steps.ctx.outputs.sha }}
          secret: ${{ secrets.BUILD_NUMBER_SECRET }}
          allocated-by: mobile

      - name: Compose build number + version string
        id: buildnum
        if: steps.changes.outputs.should_build != 'false'
        env:
          BUILD_NUMBER: ${{ steps.compute.outputs.build-number }}
          REF: ${{ steps.ctx.outputs.ref }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          # Full baked version string, matching lib/build.rs:
          #   {marketing-version}{.build-number}-{short-sha}-{prod|staging}
          # CI builds release (no -debug); set-prod-flag maps release* → prod, else staging.
          LIB_VERSION=$(grep -m1 '^version' lib/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          case "$REF" in release*) SUFFIX="prod";; *) SUFFIX="staging";; esac
          BUILD_SEGMENT=""
          [ -n "$BUILD_NUMBER" ] && BUILD_SEGMENT=".${BUILD_NUMBER}"
          BUILD_VERSION="${LIB_VERSION}${BUILD_SEGMENT}-${SHA:0:7}-${SUFFIX}"
          {
            echo "build_number=$BUILD_NUMBER"
            echo "build_version=$BUILD_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "🔢 build_number=${BUILD_NUMBER:-<none>} · build_version=$BUILD_VERSION"

      - name: Post Slack root message
        id: slack
        if: steps.changes.outputs.should_build != 'false'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          STATUS: building
          BUILD_VERSION: ${{ steps.buildnum.outputs.build_version }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
          TRIGGERED_BY: ${{ steps.ctx.outputs.triggered_by }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          PR_URL: ${{ steps.ctx.outputs.pr_url }}
          COMMIT: ${{ steps.ctx.outputs.commit_short }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.ctx.outputs.sha }}
          IOS_LINE: "⏳ building"
          ANDROID_LINE: "⏳ building"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/slack-root.py

      - name: Remove trigger label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "${{ github.event.label.name }}" || true

      - name: Cancel previous distribution runs for this branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for STATUS in in_progress queued; do
            IDS=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow mobile_distribute.yml \
              --branch "${{ github.event.pull_request.head.ref }}" \
              --status "$STATUS" \
              --json databaseId \
              --jq '.[].databaseId')
            for ID in $IDS; do
              if [ -n "$ID" ] && [ "$ID" != "${{ github.run_id }}" ]; then
                echo "Cancelling previous run: $ID"
                gh run cancel "$ID" --repo "${{ github.repository }}" || true
              fi
            done
          done

      - name: Post distribution started comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMENT_BODY="---

          ### 📱 Mobile Distribution Triggered

          🍏 **iOS** → TestFlight &nbsp;&nbsp;|&nbsp;&nbsp; 🤖 **Android** → APK ready (R2) + Slack notification

          🔗 **Workflow**: [View run](${WORKFLOW_URL})

          📍 **Branch**: \`${{ github.event.pull_request.head.ref }}\`

          🔄 **Triggered**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | contains("Mobile Distribution") or contains("iOS Build Triggered") or contains("build-report-ios")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${COMMENT_BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="${COMMENT_BODY}"
          fi

  # iOS leg, step 1: build the unsigned Godot export and publish it to R2 (no Apple creds).
  # Before paying for a WarpBuild rebuild, check whether the self-hosted iOS runner already produced
  # (or is producing) the unsigned export for THIS exact commit in R2 (ios_self_hosted.yml uploads it
  # on every push). If so, skip the rebuild and sign that artifact directly (ios-dispatch). Mirrors
  # android-notify's R2 poll + fail-fast.
  ios-resolve:
    name: 🍏 iOS — resolve (reuse existing export?)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reuse: ${{ steps.combine.outputs.reuse }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
      AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_TS:        ${{ needs.prepare.outputs.slack_ts }}
      REF:         ${{ needs.prepare.outputs.ref }}
      SHA:         ${{ needs.prepare.outputs.sha }}
      SAFE_BRANCH: ${{ needs.prepare.outputs.safe_branch }}
      GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
      # ios_self_hosted.yml is DISABLED (the `dcl-ios` Mac was shut down), so no self-hosted export
      # will ever appear for a commit — don't burn 20 minutes polling for one. Flip back to 'true'
      # together with that workflow's triggers if the runner comes back.
      IOS_SELF_HOSTED_ENABLED: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "$AWS_S3_BUCKET" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_BUCKET"
          [ -z "$AWS_ENDPOINT_URL" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ENDPOINT"
          [ -z "$AWS_ACCESS_KEY_ID" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID"
          if [ -n "$MISSING" ]; then echo "❌ Missing required secrets:$MISSING"; exit 1; fi
          echo "✅ Required secrets present"

      - name: Poll for an existing export
        id: poll
        run: |
          KEY="ios/${SAFE_BRANCH}/${SHA}/export.tar.gz"
          echo "Looking for an existing unsigned export at s3://${AWS_S3_BUCKET}/${KEY}"
          echo "(produced by the self-hosted iOS runner — ios_self_hosted.yml — for this commit)"
          have_export() { aws s3api head-object --bucket "$AWS_S3_BUCKET" --key "$KEY" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1; }

          have=false
          if have_export; then
            echo "✅ Export already present."
            have=true
          elif [ "$IOS_SELF_HOSTED_ENABLED" != "true" ]; then
            echo "ℹ️  self-hosted iOS runner is disabled → building on CI."
          else
            # The self-hosted build for this commit may still be in flight (~12 min). Poll for it,
            # but stop the moment that run concludes without a usable export (→ build on CI).
            DEADLINE=$(( $(date +%s) + 20 * 60 ))
            while true; do
              if have_export; then echo "✅ Export appeared."; have=true; break; fi
              CONCLUSION=$(gh run list --repo "${{ github.repository }}" --workflow ios_self_hosted.yml \
                --limit 100 --json headSha,conclusion \
                --jq "first(.[] | select(.headSha==\"$SHA\")) | .conclusion // empty" 2>/dev/null || true)
              case "$CONCLUSION" in
                failure|cancelled|skipped|timed_out|success)
                  echo "ℹ️  self-hosted run for $SHA concluded '$CONCLUSION' with no usable export → building on CI."
                  break ;;
              esac
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "ℹ️  timed out waiting for the self-hosted export → building on CI."
                break
              fi
              sleep 30
            done
          fi
          echo "have_export=$have" >> "$GITHUB_OUTPUT"

      # Monotonic guard (shared with Android): only reuse an export whose BAKED build number is still
      # the authoritative one from prepare. If a store shipped past it, prepare's number is higher →
      # the sidecar mismatches → rebuild so the fresh number gets baked in (else TestFlight rejects
      # the superseded CFBundleVersion). Skipped when there's no export to check.
      - name: Check baked build number is current
        id: guard
        if: steps.poll.outputs.have_export == 'true'
        uses: ./.github/actions/check-build-number-current
        with:
          bucket: ${{ env.AWS_S3_BUCKET }}
          endpoint: ${{ env.AWS_ENDPOINT_URL }}
          sidecar-key: ios/${{ env.SAFE_BRANCH }}/${{ env.SHA }}/build_number.txt
          expected-number: ${{ needs.prepare.outputs.build_number }}

      - name: Combine reuse decision
        id: combine
        run: |
          have='${{ steps.poll.outputs.have_export }}'
          current='${{ steps.guard.outputs.current }}'   # empty when the guard was skipped (no export)
          if [ "$have" = "true" ] && [ "$current" != "false" ]; then reuse=true; else reuse=false; fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "→ reuse=$reuse (have_export=$have, current=${current:-n/a})"

      - name: Slack — iOS reuse decision
        if: env.SLACK_TS != ''
        run: |
          if [ "${{ steps.combine.outputs.reuse }}" = "true" ]; then
            bash .github/scripts/slack-reply.sh "♻️ iOS — found an existing export for this commit; skipping the CI rebuild."
          else
            bash .github/scripts/slack-reply.sh "🔨 iOS — no existing export; building on CI."
          fi

  ios-build:
    name: 🍏 iOS → R2 (unsigned export)
    needs: [prepare, ios-resolve]
    if: needs.prepare.outputs.should_build == 'true' && needs.ios-resolve.outputs.reuse == 'false'
    uses: ./.github/workflows/ios_r2_artifact.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      sha: ${{ needs.prepare.outputs.sha }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      slack_ts: ${{ needs.prepare.outputs.slack_ts }}
      # Fire the godot-asc-deploy handoff from INSIDE ios-build, right after the export lands
      # in R2 — so the deploy starts immediately and runs in parallel with the Sentry upload
      # (instead of a separate job that waits for the whole build incl. Sentry to finish).
      dispatch_deploy: true
      triggered_by: ${{ needs.prepare.outputs.triggered_by }}
      whats_new: ${{ github.event.inputs.whats_new }}
    secrets: inherit

  # Reuse path: an unsigned export for this commit already exists in R2 (built by the self-hosted
  # runner), so skip WarpBuild and hand off to godot-asc-deploy directly with the same payload.
  ios-dispatch:
    name: 🍏 iOS — dispatch (reuse existing export)
    needs: [prepare, ios-resolve]
    if: needs.prepare.outputs.should_build == 'true' && needs.ios-resolve.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_TS:        ${{ needs.prepare.outputs.slack_ts }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The build number + version string come from prepare's single authoritative allocation — the
      # SAME number the self-hosted build already baked into this export for this commit.
      - name: Dispatch godot-asc-deploy (sign & upload to TestFlight)
        uses: ./.github/actions/dispatch-asc-deploy
        with:
          gh-token: ${{ secrets.ASC_DEPLOY_DISPATCH_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}
          sha: ${{ needs.prepare.outputs.sha }}
          whats_new: ${{ github.event.inputs.whats_new }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}
          slack_ts: ${{ needs.prepare.outputs.slack_ts }}
          build_version: ${{ needs.prepare.outputs.build_version }}
          build_number: ${{ needs.prepare.outputs.build_number }}
          triggered_by: ${{ needs.prepare.outputs.triggered_by }}

      - name: Slack — handed off (reused export)
        if: success() && env.SLACK_TS != ''
        run: |
          bash .github/scripts/slack-reply.sh "♻️🤝 iOS — reused export, handed off to the signing pipeline (godot-asc-deploy)."

      - name: Slack — handoff failed
        if: failure() && env.SLACK_TS != ''
        run: |
          bash .github/scripts/slack-reply.sh "❌ iOS — failed to hand off to the signing pipeline (check ASC_DEPLOY_DISPATCH_TOKEN)."

  # iOS hands off the deploy from either ios-build (rebuild path) or ios-dispatch (reuse path). If
  # resolve, build, or dispatch fails/cancels, godot-asc-deploy never runs, so nothing would move
  # the root card off BUILDING — this finalizes it. A skipped leg (the path not taken) is ignored.
  # It can't clobber the deploy repo's own root update (the deploy didn't run).
  root-failed:
    name: 🛑 Finalize root (failed/cancelled)
    needs: [prepare, ios-resolve, ios-build, ios-dispatch]
    if: >-
      always() && needs.prepare.outputs.should_build == 'true' && (
        needs.ios-resolve.result == 'failure' || needs.ios-resolve.result == 'cancelled' ||
        needs.ios-build.result == 'failure' || needs.ios-build.result == 'cancelled' ||
        needs.ios-dispatch.result == 'failure' || needs.ios-dispatch.result == 'cancelled' )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Update root → failed/cancelled
        if: needs.prepare.outputs.slack_ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_TS: ${{ needs.prepare.outputs.slack_ts }}
          TRIGGERED_BY: ${{ needs.prepare.outputs.triggered_by }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_URL: ${{ needs.prepare.outputs.pr_url }}
          COMMIT: ${{ needs.prepare.outputs.commit_short }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IOS_RESOLVE_RESULT: ${{ needs.ios-resolve.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
          IOS_DISPATCH_RESULT: ${{ needs.ios-dispatch.result }}
        run: |
          # Don't set ANDROID_LINE — merge-on-read preserves whatever the Android leg wrote.
          # Pick whichever leg actually failed; the path not taken is 'skipped' and ignored.
          if [ "$IOS_RESOLVE_RESULT" = "cancelled" ] || [ "$IOS_BUILD_RESULT" = "cancelled" ] || [ "$IOS_DISPATCH_RESULT" = "cancelled" ]; then
            export STATUS="cancelled"; export IOS_LINE="⚠️ cancelled"
          else
            export STATUS="failed"; export IOS_LINE="❌ build/handoff failed"
          fi
          python3 .github/scripts/slack-root.py

  # Android leg, step 1 (mirrors ios-resolve): the signed APK for this commit is normally produced by
  # the push CI (runner.yml → android_builds.yml) and uploaded to R2. Wait for it, then apply the SAME
  # monotonic guard as iOS. reuse=true → surface the existing APK (android-notify); reuse=false
  # (missing, superseded, or the push build failed) → rebuild it here (android-build).
  android-resolve:
    name: 🤖 Android — resolve (reuse existing APK?)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      reuse: ${{ steps.combine.outputs.reuse }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
      AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_TS:        ${{ needs.prepare.outputs.slack_ts }}
      REF:         ${{ needs.prepare.outputs.ref }}
      SHA:         ${{ needs.prepare.outputs.sha }}
      SAFE_BRANCH: ${{ needs.prepare.outputs.safe_branch }}
      GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Slack — Android resolve started
        if: env.SLACK_TS != ''
        run: |
          bash .github/scripts/slack-reply.sh "🤖 Android — checking for the signed APK from CI… (${REF})"

      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "$AWS_S3_BUCKET" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_BUCKET"
          [ -z "$AWS_ENDPOINT_URL" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ENDPOINT"
          [ -z "$AWS_ACCESS_KEY_ID" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID"
          if [ -n "$MISSING" ]; then echo "❌ Missing required secrets:$MISSING"; exit 1; fi
          echo "✅ Required secrets present"

      - name: Poll for the push-built APK
        id: poll
        run: |
          KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          echo "Waiting for s3://${AWS_S3_BUCKET}/${KEY}"
          echo "(produced by the Android CI build — runner.yml → android_builds.yml — for this commit)"
          have_apk() { aws s3 ls "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1; }

          # Build CI takes ~35 min; give it headroom. Unlike the old android-notify, a missing/failed
          # push build is NOT fatal here — it just means we rebuild the APK ourselves (android-build),
          # mirroring the iOS self-sufficient rebuild.
          DEADLINE=$(( $(date +%s) + 50 * 60 ))
          INPROG=0
          have=false
          while true; do
            if have_apk; then echo "✅ APK is available in R2."; have=true; break; fi
            CONCLUSION=$(gh run list --repo "${{ github.repository }}" --workflow runner.yml \
              --limit 100 --json headSha,conclusion \
              --jq "first(.[] | select(.headSha==\"$SHA\") | .conclusion) // empty" 2>/dev/null || true)
            case "$CONCLUSION" in
              failure|cancelled|timed_out)
                echo "ℹ️  Android CI for $SHA concluded '$CONCLUSION' with no APK → rebuilding here."
                break ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "ℹ️  timed out waiting for the push APK → rebuilding here."
              break
            fi
            if [ "$INPROG" = "0" ] && [ -n "${SLACK_CHANNEL:-}" ] && [ -n "${SLACK_TS:-}" ]; then
              bash .github/scripts/slack-reply.sh "🤖 Android — CI build in progress, waiting for the APK to land in R2…"
              INPROG=1
            fi
            echo "⏳ Not ready yet (CI conclusion='${CONCLUSION:-pending}'), retrying in 30s..."
            sleep 30
          done
          echo "have_apk=$have" >> "$GITHUB_OUTPUT"

      # Same shared guard as iOS: reuse the APK only while its baked number is still authoritative.
      - name: Check baked build number is current
        id: guard
        if: steps.poll.outputs.have_apk == 'true'
        uses: ./.github/actions/check-build-number-current
        with:
          bucket: ${{ env.AWS_S3_BUCKET }}
          endpoint: ${{ env.AWS_ENDPOINT_URL }}
          sidecar-key: android/${{ env.SAFE_BRANCH }}/${{ env.SHA }}/build_number.txt
          expected-number: ${{ needs.prepare.outputs.build_number }}

      - name: Combine reuse decision
        id: combine
        run: |
          have='${{ steps.poll.outputs.have_apk }}'
          current='${{ steps.guard.outputs.current }}'   # empty when the guard was skipped (no APK)
          if [ "$have" = "true" ] && [ "$current" != "false" ]; then reuse=true; else reuse=false; fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "→ reuse=$reuse (have_apk=$have, current=${current:-n/a})"

      - name: Slack — Android reuse decision
        if: env.SLACK_TS != ''
        run: |
          if [ "${{ steps.combine.outputs.reuse }}" = "true" ]; then
            bash .github/scripts/slack-reply.sh "♻️ Android — found a current APK for this commit; skipping the rebuild."
          else
            bash .github/scripts/slack-reply.sh "🔨 Android — no current APK; rebuilding on CI."
          fi

  # Rebuild path (mirrors ios-build): no current APK (missing, superseded, or the push build failed),
  # so build & sign a fresh one for this exact commit. android_builds.yml bakes prepare's number (via
  # its own idempotent compute-build-number) and re-uploads the APK + sidecar (+ AAB on main/release)
  # to the same R2 key android-notify surfaces. concurrency_key isolates it from the push build so
  # the two don't cancel each other.
  android-build:
    name: 🤖 Android → R2 (rebuild signed APK)
    needs: [prepare, android-resolve]
    if: needs.prepare.outputs.should_build == 'true' && needs.android-resolve.outputs.reuse == 'false'
    uses: ./.github/workflows/android_builds.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      sha: ${{ needs.prepare.outputs.sha }}
      concurrency_key: distribute-${{ needs.prepare.outputs.sha }}
    secrets: inherit

  # Surface (mirrors ios-dispatch's terminal role): by now the APK is guaranteed in R2 — either the
  # reused push build (android-resolve confirmed it) or the fresh android-build (a completed
  # dependency). Post the download link + PR comment; surface the AAB on main/release. No runner.yml
  # re-poll — an android-build rebuild lives under THIS workflow, not runner.yml. Runs on the reuse
  # path (android-build skipped) and the rebuild path alike.
  android-notify:
    name: 🤖 Android → APK ready
    needs: [prepare, android-resolve, android-build]
    if: always() && needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MOBILE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.MOBILE_ARTIFACTS_R2_ENDPOINT }}
      AWS_S3_BUCKET: ${{ secrets.MOBILE_ARTIFACTS_R2_BUCKET }}
      # Public R2 domain mapped to the mobile-artifacts bucket root.
      R2_PUBLIC_BASE_URL: "https://mobile-artifacts.dclregenesislabs.xyz"
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_TS:        ${{ needs.prepare.outputs.slack_ts }}
      REF: ${{ needs.prepare.outputs.ref }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      SAFE_BRANCH: ${{ needs.prepare.outputs.safe_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "$AWS_S3_BUCKET" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_BUCKET"
          [ -z "$AWS_ENDPOINT_URL" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ENDPOINT"
          [ -z "$AWS_ACCESS_KEY_ID" ] && MISSING="$MISSING MOBILE_ARTIFACTS_R2_ACCESS_KEY_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ Required secrets present"

      - name: Confirm APK present in R2
        run: |
          KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          echo "Confirming s3://${AWS_S3_BUCKET}/${KEY}"
          # By now the APK is expected present — either the reused push build (android-resolve
          # confirmed it) or the fresh android-build (a completed dependency). Short poll for R2
          # eventual consistency; fail (→ failure surface below) only if it's genuinely absent.
          DEADLINE=$(( $(date +%s) + 10 * 60 ))
          while true; do
            if aws s3 ls "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1; then
              echo "✅ APK is available in R2"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "❌ APK not found in R2 ($KEY) — the Android build/rebuild must have failed."
              exit 1
            fi
            echo "⏳ Not visible yet, retrying in 20s..."
            sleep 20
          done

      - name: Slack — Android APK ready
        if: success() && env.SLACK_TS != ''
        run: |
          APK="${R2_PUBLIC_BASE_URL}/android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          bash .github/scripts/slack-reply.sh "✅ Android — APK ready: ${APK}"
          ANDROID_LINE="✅ APK ready" APK_URL="$APK" python3 .github/scripts/slack-root.py

      # Firebase App Distribution: push the freshly-built signed APK (already in R2) to the
      # testers' real devices — the Android counterpart of the iOS TestFlight leg. Free, no app
      # changes. Lives in this workflow (not android_builds.yml) so testers are only notified on
      # intentional distributions — release push / main cron / `build` label / dispatch — never on
      # every PR.
      #
      # Auth is KEYLESS via Workload Identity Federation: the org disables downloadable
      # service-account keys (constraints/iam.disableServiceAccountKeyCreation), so instead the
      # runner's OIDC token impersonates the fad-ci service account to mint a short-lived access
      # token (needs the IAM Service Account Credentials API enabled). Gated on GCP_WIF_PROVIDER so
      # the whole thing is a clean no-op until WIF is configured.
      # (WIF verified against project decentraland-mobile-app / service account fad-ci.)
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        if: success() && vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Distribute Android APK to Firebase App Distribution
        # Only runs once WIF auth succeeded (auth step is skipped → this is skipped too).
        # Uses the App Distribution REST API directly with the WIF-minted access token — firebase-tools
        # cannot read WIF/external-account ADC ("Failed to authenticate"), and the org forbids the
        # service-account keys firebase-tools would otherwise need.
        if: success() && steps.gcp-auth.outcome == 'success'
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          # Comma-separated Firebase tester group aliases (created in the Firebase console).
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'qa' }}
          PROJECT_NUMBER: '300605090472'
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "⚠️  FIREBASE_ANDROID_APP_ID not set — skipping App Distribution."
            exit 0
          fi
          BASE=https://firebaseappdistribution.googleapis.com

          APK_KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          echo "📥 Downloading APK from R2: ${APK_KEY}"
          aws s3 cp "s3://${AWS_S3_BUCKET}/${APK_KEY}" ./firebase-dist.apk --endpoint-url "$AWS_ENDPOINT_URL"

          echo "▶️  Uploading APK to App Distribution…"
          UP=$(curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: decentraland.godot.client.apk" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @firebase-dist.apk \
            "${BASE}/upload/v1/projects/${PROJECT_NUMBER}/apps/${FIREBASE_ANDROID_APP_ID}/releases:upload")
          OP=$(echo "$UP" | jq -r '.name // empty')
          if [ -z "$OP" ]; then echo "❌ upload failed: $UP"; exit 1; fi

          echo "▶️  Waiting for the release to be processed…"
          REL=""
          for _ in $(seq 1 40); do
            R=$(curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" "${BASE}/v1/${OP}")
            if [ "$(echo "$R" | jq -r '.done // false')" = "true" ]; then
              REL=$(echo "$R" | jq -r '.response.release.name // empty')
              break
            fi
            sleep 5
          done
          if [ -z "$REL" ]; then echo "❌ release not created: ${R:-<no response>}"; exit 1; fi
          echo "✅ Release: $REL"

          # Release notes (best-effort — don't fail the distribution if this patch errors).
          RELEASE_NOTES="branch ${REF} · commit ${SHA:0:7} · $(date -u +'%Y-%m-%d %H:%M UTC')"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$RELEASE_NOTES" '{releaseNotes:{text:$t}}')" \
            "${BASE}/v1/${REL}?updateMask=release_notes.text" >/dev/null || true

          echo "📲 Distributing to Firebase groups: ${FIREBASE_TESTER_GROUPS}"
          GJSON=$(echo "$FIREBASE_TESTER_GROUPS" | jq -R 'split(",")')
          DIST=$(curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"groupAliases\": ${GJSON}}" \
            "${BASE}/v1/${REL}:distribute")
          if echo "$DIST" | jq -e '.error' >/dev/null 2>&1; then echo "❌ distribute failed: $DIST"; exit 1; fi

          rm -f ./firebase-dist.apk
          echo "FIREBASE_DIST_OK=true" >> "$GITHUB_ENV"

      - name: Slack — Android sent to Firebase App Distribution
        if: success() && env.FIREBASE_DIST_OK == 'true' && env.SLACK_TS != ''
        env:
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'qa' }}
        run: |
          bash .github/scripts/slack-reply.sh "📲 Android — sent to Firebase App Distribution (groups: ${FIREBASE_TESTER_GROUPS})"

      - name: Slack — Android failed
        if: failure() && env.SLACK_TS != ''
        run: |
          bash .github/scripts/slack-reply.sh "❌ Android — APK not produced for ${SHA} (CI build failed)"
          ANDROID_LINE="❌ CI build failed" python3 .github/scripts/slack-root.py

      # The AAB (Play Store artifact) is only published for main/release* builds, so we
      # surface it for any main/release* distribution (manual dispatch, push-to-release,
      # or the weekday main cron). Best-effort: if the AAB isn't in R2 we warn and skip
      # rather than failing the job.
      - name: Wait for Android AAB in R2
        if: success() && (needs.prepare.outputs.ref == 'main' || startsWith(needs.prepare.outputs.ref, 'release'))
        run: |
          KEY="android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.aab"
          echo "Waiting for s3://${AWS_S3_BUCKET}/${KEY}"

          # The AAB is uploaded in the same CI step as the APK, so it should already be
          # present now that the APK wait succeeded — short timeout is enough.
          DEADLINE=$(( $(date +%s) + 15 * 60 ))
          while true; do
            if aws s3 ls "s3://${AWS_S3_BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1; then
              echo "✅ AAB is available in R2"
              echo "AAB_READY=true" >> "$GITHUB_ENV"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "⚠️  AAB not found in R2 after timeout ($KEY) — skipping AAB notification."
              echo "AAB_READY=false" >> "$GITHUB_ENV"
              break
            fi
            echo "⏳ AAB not ready yet, retrying in 20s..."
            sleep 20
          done

      - name: Slack — Android AAB ready
        if: success() && env.AAB_READY == 'true' && env.SLACK_TS != ''
        run: |
          bash .github/scripts/slack-reply.sh "📦 Android — AAB ready (Play Store): ${R2_PUBLIC_BASE_URL}/android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.aab"

      - name: Update PR comment - Android success
        if: success() && needs.prepare.outputs.pr_number != ''
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APK_URL="${R2_PUBLIC_BASE_URL}/android/${SAFE_BRANCH}/${SHA}/decentraland.godot.client.apk"
          COMMENT_BODY="---

          ### 🤖 Android Build Ready

          ✅ **Status**: APK available for download

          📱 **Download APK**: [direct link](${APK_URL})

          🔗 **Workflow**: [View run](${WORKFLOW_URL})

          📍 **Branch**: \`${REF}\` &nbsp;&nbsp;|&nbsp;&nbsp; **Commit**: \`${SHA}\`

          🔄 **Completed**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("🤖 Android Build")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${COMMENT_BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${COMMENT_BODY}"
          fi

      - name: Update PR comment - Android failure
        if: failure() && needs.prepare.outputs.pr_number != ''
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMENT_BODY="---

          ### 🤖 Android Build Failed

          ❌ **Status**: No APK was produced for this commit

          🔗 **Workflow**: [View logs](${WORKFLOW_URL})

          📍 **Branch**: \`${REF}\` &nbsp;&nbsp;|&nbsp;&nbsp; **Commit**: \`${SHA}\`

          🔄 **Failed**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("🤖 Android Build")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${COMMENT_BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${COMMENT_BODY}"
          fi
