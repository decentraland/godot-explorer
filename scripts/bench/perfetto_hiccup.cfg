# Perfetto system trace for main-thread hiccup blame (issue #3015).
#
# Scheduler events (who runs, who sleeps on what, who wakes whom) for every
# thread, plus the engine's own zones ("godot" track_event category: only an
# engine built with `scons profiler=perfetto` emits them) and the explorer
# zones routed through DclProfiler. Both land in the same trace so
# scripts/bench/hiccup_report.py can say, for each long frame, which thread
# the main thread waited on and what that thread was doing.
#
# Pushed by scripts/bench/profile_android_hiccups.sh, which fills in
# duration_ms. Written straight to the file so the whole load fits.

buffers: { size_kb: 262144 fill_policy: RING_BUFFER }
write_into_file: true
file_write_period_ms: 500
duration_ms: __DURATION_MS__

data_sources: {
    config {
        name: "linux.ftrace"
        ftrace_config {
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            ftrace_events: "sched/sched_wakeup_new"
            ftrace_events: "sched/sched_process_exit"
            ftrace_events: "sched/sched_process_free"
            ftrace_events: "task/task_newtask"
            ftrace_events: "task/task_rename"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"
            atrace_apps: "org.decentraland.godotexplorer"
            atrace_categories: "gfx"
            atrace_categories: "view"
        }
    }
}

data_sources: {
    config {
        name: "linux.process_stats"
        process_stats_config { scan_all_processes_on_start: true }
    }
}

data_sources: {
    config {
        name: "track_event"
        track_event_config { enabled_categories: "godot" }
    }
}

data_sources: {
    config {
        name: "android.surfaceflinger.frametimeline"
    }
}
