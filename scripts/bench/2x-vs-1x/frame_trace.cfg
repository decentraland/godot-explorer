# Perfetto config for the 2.x-vs-1.x benchmark (#3206).
# One source of truth for both builds: the frames the device actually presents,
# so the numbers do not depend on either client's own logging.
buffers {
  # A 60 s window fits in 128 MB, a long soak does not: with 128 MB a 71 min run kept only the
  # last ~6 min of frame timeline and lost the process table, which leaves the fps query with no
  # rows to join. Soak runs are chunked into 10 min windows instead (see the protocol).
  size_kb: 131072
  fill_policy: RING_BUFFER
}
data_sources {
  config {
    name: "android.surfaceflinger.frametimeline"
  }
}
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "thermal/thermal_temperature"
      buffer_size_kb: 4096
    }
  }
}
data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 5000
    }
  }
}
data_sources {
  config {
    name: "android.packages_list"
  }
}
duration_ms: 60000
